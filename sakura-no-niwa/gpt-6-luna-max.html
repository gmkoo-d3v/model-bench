<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a9d2e3">
  <meta name="description" content="A floating voxel pagoda garden with a living sky, koi pond, cherry blossoms, and a day-night cycle.">
  <title>桜の庭 — Voxel Pagoda Garden</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(15, 22, 35, 0.82);
      --panel-edge: rgba(255, 255, 255, 0.14);
      --text: #f5f4f1;
      --muted: #b8c2d0;
      --accent: #f5a3b9;
      --accent-strong: #ff789f;
      --button: rgba(255, 255, 255, 0.09);
      --button-hover: rgba(255, 255, 255, 0.17);
      --focus: rgba(255, 181, 203, 0.72);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #a9d2e3;
    }

    body {
      color: var(--text);
    }

    #scene-root {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #a9d2e3;
    }

    #scene-root canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    .panel {
      position: fixed;
      z-index: 5;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      width: min(326px, calc(100vw - 28px));
      max-height: calc(100dvh - 28px);
      overflow-y: auto;
      padding: 16px 16px 13px;
      border: 1px solid var(--panel-edge);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: 0 16px 50px rgba(8, 13, 24, 0.28);
      backdrop-filter: blur(17px) saturate(1.2);
      -webkit-backdrop-filter: blur(17px) saturate(1.2);
      scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
      scrollbar-width: thin;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .seed-badge {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
    }

    .control-row {
      display: grid;
      grid-template-columns: minmax(76px, 0.95fr) minmax(90px, 1.5fr) 52px;
      align-items: center;
      gap: 9px;
      min-height: 31px;
      margin: 4px 0;
    }

    .control-label {
      color: #e8eaf0;
      font-size: 11px;
      font-weight: 550;
    }

    .control-value {
      color: #ffffff;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      height: 18px;
      margin: 0;
      accent-color: var(--accent-strong);
      cursor: pointer;
    }

    .play-row {
      display: grid;
      grid-template-columns: auto minmax(78px, 1fr) 43px;
      align-items: center;
      gap: 9px;
      margin: 8px 0 10px;
    }

    .play-row input[type="range"] {
      min-width: 55px;
    }

    button {
      min-height: 30px;
      padding: 6px 9px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--text);
      background: var(--button);
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    button:hover {
      border-color: rgba(255, 255, 255, 0.28);
      background: var(--button-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    #play-cycle {
      min-width: 107px;
      color: #ffe8ef;
      border-color: rgba(245, 163, 185, 0.36);
    }

    .divider {
      height: 1px;
      margin: 11px 0;
      background: rgba(255, 255, 255, 0.12);
    }

    .section-label {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .check-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 10px;
      margin: 8px 0 12px;
    }

    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 20px;
      color: #e6e9ef;
      font-size: 10px;
      cursor: pointer;
      user-select: none;
    }

    .check-label input {
      width: 13px;
      height: 13px;
      margin: 0;
      accent-color: var(--accent-strong);
      cursor: pointer;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .preset-button {
      grid-column: span 2;
      min-height: 32px;
      padding-inline: 5px;
      font-size: 9px;
      white-space: nowrap;
    }

    .preset-button:nth-child(4) {
      grid-column: 2 / span 2;
    }

    .preset-button:nth-child(5) {
      grid-column: 4 / span 2;
    }

    .preset-key {
      display: inline-grid;
      width: 15px;
      height: 15px;
      margin-right: 3px;
      place-items: center;
      border-radius: 4px;
      color: #ffc5d5;
      background: rgba(255, 255, 255, 0.1);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 11px;
    }

    .action-row button:first-child {
      border-color: rgba(245, 163, 185, 0.34);
      color: #ffe6ee;
    }

    .status-line {
      position: fixed;
      z-index: 4;
      bottom: max(13px, env(safe-area-inset-bottom));
      left: max(14px, env(safe-area-inset-left));
      max-width: calc(100vw - 28px);
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #f4f6f8;
      background: rgba(14, 21, 33, 0.64);
      box-shadow: 0 5px 20px rgba(8, 13, 24, 0.18);
      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.035em;
      white-space: nowrap;
      pointer-events: none;
    }

    .brand {
      position: fixed;
      z-index: 3;
      top: max(23px, env(safe-area-inset-top));
      right: max(25px, env(safe-area-inset-right));
      color: #ffffff;
      text-align: right;
      text-shadow: 0 2px 16px rgba(26, 47, 68, 0.42);
      pointer-events: none;
    }

    .brand-jp {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
      font-size: clamp(30px, 4vw, 54px);
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1;
    }

    .brand-en {
      margin: 9px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.28em;
    }

    .hint {
      position: fixed;
      z-index: 3;
      right: max(22px, env(safe-area-inset-right));
      bottom: max(19px, env(safe-area-inset-bottom));
      color: rgba(255, 255, 255, 0.82);
      font-size: 10px;
      letter-spacing: 0.03em;
      text-align: right;
      text-shadow: 0 2px 8px rgba(12, 24, 38, 0.42);
      pointer-events: none;
    }

    .hint kbd {
      display: inline-grid;
      min-width: 19px;
      height: 19px;
      margin-inline: 2px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 5px;
      background: rgba(18, 28, 39, 0.3);
      font: inherit;
      font-size: 9px;
    }

    @media (max-width: 650px) {
      .panel {
        top: max(9px, env(safe-area-inset-top));
        left: max(9px, env(safe-area-inset-left));
        width: min(292px, calc(100vw - 18px));
        max-height: min(70dvh, calc(100dvh - 80px));
        padding: 12px 12px 10px;
        border-radius: 12px;
      }

      .brand {
        top: max(17px, env(safe-area-inset-top));
        right: max(14px, env(safe-area-inset-right));
      }

      .brand-jp {
        font-size: clamp(25px, 7vw, 38px);
      }

      .brand-en {
        font-size: 7px;
        letter-spacing: 0.19em;
      }

      .status-line {
        bottom: max(9px, env(safe-area-inset-bottom));
        left: max(9px, env(safe-area-inset-left));
        padding: 7px 8px;
        font-size: 9px;
      }

      .hint {
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        font-size: 9px;
      }
    }

    @media (max-width: 390px) {
      .panel {
        width: min(250px, calc(100vw - 18px));
      }

      .control-row {
        grid-template-columns: 67px minmax(78px, 1fr) 48px;
        gap: 7px;
      }

      #play-cycle {
        min-width: 96px;
        font-size: 9px;
      }

      .play-row {
        grid-template-columns: auto minmax(58px, 1fr) 40px;
        gap: 7px;
      }

      .hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="scene-root" aria-label="Interactive voxel pagoda garden"></main>

  <section class="panel" aria-labelledby="controls-title">
    <header class="panel-heading">
      <h1 class="panel-title" id="controls-title">Controls</h1>
      <span class="seed-badge" id="seed-badge">seed 00000000</span>
    </header>

    <label class="control-row" for="time-slider">
      <span class="control-label">Time</span>
      <input id="time-slider" type="range" min="0" max="24" step="0.01" value="16.25" aria-label="Time of day">
      <output class="control-value" id="time-value" for="time-slider">16:15</output>
    </label>

    <div class="play-row">
      <button id="play-cycle" type="button" aria-pressed="false">▶ Play cycle</button>
      <label class="sr-only" for="speed-slider">Cycle speed</label>
      <input id="speed-slider" type="range" min="0.25" max="4" step="0.25" value="1" aria-label="Cycle speed">
      <output class="control-value" id="speed-value" for="speed-slider">1×</output>
    </div>

    <label class="control-row" for="petal-slider">
      <span class="control-label">Petals</span>
      <input id="petal-slider" type="range" min="0" max="3000" step="25" value="1200" aria-label="Falling petal count">
      <output class="control-value" id="petal-value" for="petal-slider">1,200</output>
    </label>

    <label class="control-row" for="wind-slider">
      <span class="control-label">Wind</span>
      <input id="wind-slider" type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Wind strength">
      <output class="control-value" id="wind-value" for="wind-slider">0.35</output>
    </label>

    <div class="divider"></div>
    <p class="section-label">Scene</p>
    <div class="check-grid">
      <label class="check-label" for="auto-rotate"><input id="auto-rotate" type="checkbox">Auto-rotate</label>
      <label class="check-label" for="shadows"><input id="shadows" type="checkbox" checked>Shadows</label>
      <label class="check-label" for="fireflies"><input id="fireflies" type="checkbox" checked>Fireflies</label>
      <label class="check-label" for="water-anim"><input id="water-anim" type="checkbox" checked>Water anim</label>
      <label class="check-label" for="wireframe"><input id="wireframe" type="checkbox">Wireframe</label>
    </div>

    <p class="section-label">Camera views</p>
    <div class="preset-grid" role="group" aria-label="Camera presets">
      <button class="preset-button" type="button" data-preset="0"><span class="preset-key">1</span>Overview</button>
      <button class="preset-button" type="button" data-preset="1"><span class="preset-key">2</span>Pagoda</button>
      <button class="preset-button" type="button" data-preset="2"><span class="preset-key">3</span>Pond</button>
      <button class="preset-button" type="button" data-preset="3"><span class="preset-key">4</span>Torii</button>
      <button class="preset-button" type="button" data-preset="4"><span class="preset-key">5</span>Blossoms</button>
    </div>

    <div class="action-row">
      <button id="regenerate" type="button">Regenerate seed</button>
      <button id="reset-view" type="button">Reset view</button>
    </div>
  </section>

  <aside class="brand" aria-label="Sakura no niwa, voxel pagoda garden">
    <p class="brand-jp">桜の庭</p>
    <p class="brand-en">VOXEL PAGODA GARDEN</p>
  </aside>

  <output class="status-line" id="status-line" aria-live="polite">voxels: 0 &nbsp; 16:15 &nbsp; fps: 0</output>
  <div class="hint" aria-hidden="true">Drag to orbit <kbd>1</kbd>–<kbd>5</kbd> camera views</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const root = document.getElementById("scene-root");
    const timeSlider = document.getElementById("time-slider");
    const timeValue = document.getElementById("time-value");
    const speedSlider = document.getElementById("speed-slider");
    const speedValue = document.getElementById("speed-value");
    const petalSlider = document.getElementById("petal-slider");
    const petalValue = document.getElementById("petal-value");
    const windSlider = document.getElementById("wind-slider");
    const windValue = document.getElementById("wind-value");
    const playButton = document.getElementById("play-cycle");
    const autoRotateInput = document.getElementById("auto-rotate");
    const shadowsInput = document.getElementById("shadows");
    const firefliesInput = document.getElementById("fireflies");
    const waterAnimInput = document.getElementById("water-anim");
    const wireframeInput = document.getElementById("wireframe");
    const statusLine = document.getElementById("status-line");
    const seedBadge = document.getElementById("seed-badge");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#a9d2e3");
    scene.fog = new THREE.Fog("#a9d2e3", 62, 150);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      240
    );
    camera.position.set(43, 33, 49);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = shadowsInput.checked;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.tabIndex = 0;
    renderer.domElement.setAttribute("aria-label", "Three-dimensional voxel garden. Drag to orbit and scroll to zoom.");
    root.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.075;
    controls.minDistance = 20;
    controls.maxDistance = 112;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, -1.5, 0);
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.28;
    controls.update();

    const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
    const worldMeshes = [];
    const voxelMaterials = [];
    const staticVoxels = [];
    const waterBlocks = [];
    const koiParts = [];
    const fishMotions = [];
    const grassPalette = ["#619d48", "#70aa4e", "#558d42"];
    const dirtPalette = ["#80533d", "#70452f", "#916044", "#76503b"];
    const rockPalette = ["#737a7a", "#858b89", "#606b70", "#92958f", "#697176"];
    const pathPalette = ["#aaa9a0", "#c1bdb0", "#969990", "#d0cbbb"];
    const petalPalette = ["#ffd9e5", "#ffaec5", "#ffe8ec", "#ef91ae"];
    const blossomPalette = ["#f7a3bd", "#ffd0dd", "#fff0f1"];
    const koiPalette = ["#ef7836", "#f6f0dc", "#d94b32", "#202a2b"];

    let activeSeed = 0x5a4b2024;
    let random = null;
    let layout = null;
    let petalMesh = null;
    let fireflyPoints = null;
    let fireflyMaterial = null;
    let petalStates = [];
    let fireflyStates = [];
    let currentPetalCount = Number(petalSlider.value);
    let currentTime = Number(timeSlider.value);
    let cyclePlaying = false;
    let cameraFlight = null;
    let fpsFrames = 0;
    let fpsElapsed = 0;
    let displayedFps = 0;
    let lastClockLabel = "16:15";
    let elapsedSeconds = 0;
    let previousFrameTime = performance.now();
    let staticVoxelCount = 0;
    let waterVoxelCount = 0;
    let koiVoxelCount = 0;

    const matrixHelper = new THREE.Object3D();
    const colorHelper = new THREE.Color();
    const timeClock = new THREE.Clock();

    function mulberry32(seed) {
      let state = seed >>> 0;
      return function nextRandom() {
        state = (state + 0x6D2B79F5) >>> 0;
        let value = state;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
    }

    function randomBetween(minimum, maximum) {
      return minimum + random() * (maximum - minimum);
    }

    function randomInteger(minimum, maximum) {
      return Math.floor(randomBetween(minimum, maximum + 1));
    }

    function pickColor(palette) {
      return palette[Math.floor(random() * palette.length)];
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function smoothstep(edge0, edge1, value) {
      const amount = clamp((value - edge0) / (edge1 - edge0), 0, 1);
      return amount * amount * (3 - 2 * amount);
    }

    function formatClock(hourValue) {
      if (hourValue >= 24) {
        return "24:00";
      }
      const bounded = clamp(hourValue, 0, 23.9999);
      const hour = Math.floor(bounded);
      const minute = Math.floor((bounded - hour) * 60);
      return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    function updateTimeLabels() {
      lastClockLabel = formatClock(currentTime);
      timeValue.value = lastClockLabel;
      timeValue.textContent = lastClockLabel;
    }

    function addVoxel(x, y, z, color) {
      staticVoxels.push({ x, y, z, color });
    }

    function addVoxelLine(x0, y0, z0, x1, y1, z1, color) {
      const steps = Math.max(
        Math.abs(x1 - x0),
        Math.abs(y1 - y0),
        Math.abs(z1 - z0)
      );
      if (steps === 0) {
        addVoxel(x0, y0, z0, color);
        return;
      }
      for (let step = 0; step <= steps; step += 1) {
        const amount = step / steps;
        addVoxel(
          Math.round(THREE.MathUtils.lerp(x0, x1, amount)),
          Math.round(THREE.MathUtils.lerp(y0, y1, amount)),
          Math.round(THREE.MathUtils.lerp(z0, z1, amount)),
          color
        );
      }
    }

    function addRing(centerX, y, centerZ, halfWidth, halfDepth, color) {
      for (let x = -halfWidth; x <= halfWidth; x += 1) {
        addVoxel(centerX + x, y, centerZ - halfDepth, color);
        addVoxel(centerX + x, y, centerZ + halfDepth, color);
      }
      for (let z = -halfDepth + 1; z < halfDepth; z += 1) {
        addVoxel(centerX - halfWidth, y, centerZ + z, color);
        addVoxel(centerX + halfWidth, y, centerZ + z, color);
      }
    }

    function makeLayout() {
      const pagodaX = randomInteger(-1, 1);
      const pagodaZ = randomInteger(-1, 1);
      const pondX = pagodaX - 9 + randomInteger(-1, 1);
      const pondZ = pagodaZ + 5 + randomInteger(-1, 1);
      const treeAnchors = [
        [-15, -11],
        [13, -12],
        [16, 5],
        [-14, 12],
        [4, 16]
      ];
      const trees = treeAnchors.map(([x, z]) => ({
        x: x + randomInteger(-1, 1),
        z: z + randomInteger(-1, 1),
        height: randomInteger(6, 9),
        crown: randomBetween(2.6, 3.35)
      }));
      return {
        pagoda: { x: pagodaX, z: pagodaZ },
        pond: { x: pondX, z: pondZ, radiusX: 5.3, radiusZ: 4.0 },
        torii: { x: pagodaX, z: pagodaZ - 18 },
        trees
      };
    }

    function isPondTile(x, z) {
      const dx = (x - layout.pond.x) / layout.pond.radiusX;
      const dz = (z - layout.pond.z) / layout.pond.radiusZ;
      const rippledEdge = 1
        + 0.075 * Math.sin(x * 1.37 + z * 0.61)
        + 0.055 * Math.cos(z * 1.11 - x * 0.73);
      return Math.sqrt(dx * dx + dz * dz) < rippledEdge;
    }

    function buildIsland() {
      const extent = 23;
      for (let x = -extent; x <= extent; x += 1) {
        for (let z = -extent; z <= extent; z += 1) {
          const angle = Math.atan2(z, x);
          const radial = Math.sqrt(x * x + z * z);
          const edgeNoise = (random() - 0.5) * 0.9;
          const edgeRadius = 21.8
            + Math.sin(angle * 7.0 + 0.4) * 0.78
            + Math.cos(angle * 11.0 - 0.8) * 0.46
            + edgeNoise;
          if (radial > edgeRadius) {
            continue;
          }

          const inset = Math.max(0, 1 - radial / edgeRadius);
          const depthWobble = (random() - 0.5) * 1.8;
          const maximumDepth = Math.max(
            2,
            Math.floor(3 + inset * inset * 24 + depthWobble)
          );
          if (!isPondTile(x, z)) {
            addVoxel(x, 0, z, pickColor(grassPalette));
          }

          for (let depth = 1; depth <= maximumDepth; depth += 1) {
            const cliffInset = Math.max(0, depth - 2) * 0.11;
            if (radial > edgeRadius - cliffInset) {
              continue;
            }
            const color = depth <= 3
              ? pickColor(dirtPalette)
              : pickColor(rockPalette);
            addVoxel(x, -depth, z, color);
          }
        }
      }

      for (let ridge = 0; ridge < 95; ridge += 1) {
        const angle = randomBetween(0, Math.PI * 2);
        const radius = randomBetween(16.8, 20.5);
        const x = Math.round(Math.cos(angle) * radius);
        const z = Math.round(Math.sin(angle) * radius);
        const y = -randomInteger(1, 5);
        const stones = randomInteger(1, 4);
        for (let index = 0; index < stones; index += 1) {
          addVoxel(
            x + randomInteger(-1, 1),
            y - index,
            z + randomInteger(-1, 1),
            pickColor(rockPalette)
          );
        }
      }
    }

    function buildPond() {
      for (let x = -16; x <= 0; x += 1) {
        for (let z = -1; z <= 11; z += 1) {
          if (!isPondTile(x, z)) {
            continue;
          }
          waterBlocks.push({
            x,
            y: -0.055,
            z,
            baseY: -0.055,
            color: random() < 0.42 ? "#4b9db5" : "#3689a6",
            phase: randomBetween(0, Math.PI * 2)
          });
        }
      }

      for (let x = -16; x <= 0; x += 1) {
        for (let z = -1; z <= 11; z += 1) {
          if (isPondTile(x, z)) {
            continue;
          }
          const nearWater = [
            [x + 1, z],
            [x - 1, z],
            [x, z + 1],
            [x, z - 1]
          ].some(([neighborX, neighborZ]) => isPondTile(neighborX, neighborZ));
          if (nearWater && random() < 0.36) {
            addVoxel(x, 0, z, pickColor(pathPalette));
          }
        }
      }
    }

    function buildPagoda() {
      const centerX = layout.pagoda.x;
      const centerZ = layout.pagoda.z;
      const timber = ["#262b2d", "#343a3a", "#1c2428"];
      const roofColors = ["#26363a", "#304347", "#202c31", "#3b4b4b"];
      const red = ["#a8312d", "#bd4034", "#8d2929"];
      const plaster = ["#eee8da", "#f7f1e3", "#dedbd2"];
      const widths = [11, 9, 7, 5, 3];
      const roofWidths = [13, 11, 9, 7, 5];
      const wallHeight = 2;
      const tierPitch = 5;
      const baseY = 1;

      for (let x = -6; x <= 6; x += 1) {
        for (let z = -6; z <= 6; z += 1) {
          if (Math.max(Math.abs(x), Math.abs(z)) <= 5) {
            addVoxel(centerX + x, 0, centerZ + z, pickColor(timber));
          }
        }
      }

      for (let tier = 0; tier < widths.length; tier += 1) {
        const width = widths[tier];
        const roofWidth = roofWidths[tier];
        const half = (width - 1) / 2;
        const bottom = baseY + tier * tierPitch;
        const roofBase = bottom + wallHeight;

        for (let x = -half; x <= half; x += 1) {
          for (let z = -half; z <= half; z += 1) {
            if (Math.max(Math.abs(x), Math.abs(z)) === half) {
              addVoxel(centerX + x, bottom - 1, centerZ + z, pickColor(timber));
            }
          }
        }

        for (let y = bottom; y < bottom + wallHeight; y += 1) {
          for (let offset = -half; offset <= half; offset += 1) {
            const corner = Math.abs(offset) === half;
            const baseColor = corner ? pickColor(timber) : pickColor(plaster);
            const frontDoor = tier === 0
              && Math.abs(offset) <= 1
              && y < bottom + 2;
            if (!frontDoor) {
              addVoxel(centerX + offset, y, centerZ - half, baseColor);
              addVoxel(centerX + offset, y, centerZ + half, baseColor);
              addVoxel(centerX - half, y, centerZ + offset, baseColor);
              addVoxel(centerX + half, y, centerZ + offset, baseColor);
            }
          }
        }

        for (let offset = -half; offset <= half; offset += 1) {
          addVoxel(centerX + offset, roofBase - 1, centerZ - half, pickColor(red));
          addVoxel(centerX + offset, roofBase - 1, centerZ + half, pickColor(red));
          addVoxel(centerX - half, roofBase - 1, centerZ + offset, pickColor(red));
          addVoxel(centerX + half, roofBase - 1, centerZ + offset, pickColor(red));
        }

        for (let layer = 0; layer < 3; layer += 1) {
          const layerWidth = roofWidth - layer * 2;
          const roofHalf = (layerWidth - 1) / 2;
          const y = roofBase + layer;
          for (let x = -roofHalf; x <= roofHalf; x += 1) {
            for (let z = -roofHalf; z <= roofHalf; z += 1) {
              const isEave = Math.max(Math.abs(x), Math.abs(z)) === roofHalf;
              const roofColor = isEave && layer === 0
                ? pickColor(timber)
                : pickColor(roofColors);
              addVoxel(centerX + x, y, centerZ + z, roofColor);
            }
          }
          if (layer === 0) {
            for (const directionX of [-1, 1]) {
              for (const directionZ of [-1, 1]) {
                addVoxel(
                  centerX + directionX * roofHalf,
                  y + 1,
                  centerZ + directionZ * roofHalf,
                  pickColor(roofColors)
                );
              }
            }
          }
        }

        const upperHalf = (roofWidth - 3) / 2;
        for (let direction = -1; direction <= 1; direction += 2) {
          addVoxel(centerX + direction * upperHalf, roofBase + 3, centerZ, pickColor(red));
          addVoxel(centerX, roofBase + 3, centerZ + direction * upperHalf, pickColor(red));
        }
      }

      const spireBase = baseY + widths.length * tierPitch;
      for (let y = 0; y < 7; y += 1) {
        addVoxel(centerX, spireBase + y, centerZ, y % 2 === 0 ? "#292f30" : "#b58a43");
      }
      for (const [height, radius] of [[1, 2], [3, 2], [5, 1]]) {
        addRing(centerX, spireBase + height, centerZ, radius, radius, "#b58a43");
      }
      addVoxel(centerX, spireBase + 7, centerZ, "#e3b952");
      addVoxel(centerX, spireBase + 8, centerZ, "#f1d37b");

      for (let tier = 0; tier < widths.length; tier += 1) {
        const bottom = baseY + tier * tierPitch;
        const half = (widths[tier] - 1) / 2;
        if (tier > 0) {
          for (let offset = -half; offset <= half; offset += 1) {
            addVoxel(centerX + offset, bottom, centerZ - half, pickColor(red));
            addVoxel(centerX + offset, bottom, centerZ + half, pickColor(red));
          }
        }
      }
    }

    function buildTorii() {
      const centerX = layout.torii.x;
      const centerZ = layout.torii.z;
      const red = "#bb3c35";
      const dark = "#222a2d";
      for (const side of [-1, 1]) {
        const x = centerX + side * 3;
        for (let y = 1; y <= 8; y += 1) {
          const columnColor = y >= 7 ? dark : red;
          addVoxel(x, y, centerZ, columnColor);
          if (y <= 2) {
            addVoxel(x + side, y, centerZ, dark);
          }
        }
        addVoxel(x, 9, centerZ, dark);
      }

      for (let x = -6; x <= 6; x += 1) {
        addVoxel(centerX + x, 8, centerZ, red);
        addVoxel(centerX + x, 9, centerZ, x < -5 || x > 5 ? dark : "#292e31");
      }
      for (let x = -7; x <= 7; x += 1) {
        addVoxel(centerX + x, 10, centerZ, dark);
      }
      for (let x = -4; x <= 4; x += 1) {
        addVoxel(centerX + x, 6, centerZ, dark);
      }
      addVoxel(centerX, 7, centerZ, "#d7b85f");
      addVoxel(centerX, 8, centerZ - 1, "#303739");
    }

    function buildStonePath() {
      const startZ = layout.torii.z + 2;
      const endZ = layout.pagoda.z - 5;
      let lastX = layout.pagoda.x;
      for (let z = endZ; z >= startZ; z -= 1) {
        if (random() < 0.38) {
          lastX += randomInteger(-1, 1);
        }
        const centerX = clamp(lastX, layout.pagoda.x - 2, layout.pagoda.x + 2);
        addVoxel(centerX, 0, z, pickColor(pathPalette));
        for (const side of [-1, 1]) {
          if (random() < 0.74) {
            addVoxel(centerX + side, 0, z + randomInteger(-1, 1), pickColor(pathPalette));
          }
        }
      }

      for (let step = 0; step < 34; step += 1) {
        const z = endZ + randomInteger(-2, 1);
        const x = layout.pagoda.x + randomInteger(-4, 4);
        if (Math.abs(x - layout.pagoda.x) < 2 && Math.abs(z - layout.pagoda.z) < 7) {
          continue;
        }
        addVoxel(x, 0, z, pickColor(pathPalette));
      }
    }

    function buildBridge() {
      const centerX = Math.round(layout.pond.x);
      const centerZ = Math.round(layout.pond.z);
      const plankColors = ["#433b37", "#51453e", "#342f2e"];
      for (let z = -5; z <= 5; z += 1) {
        const arch = Math.max(0, 2 - Math.abs(z) * 0.38);
        for (let x = -1; x <= 1; x += 1) {
          addVoxel(centerX + x, 1 + Math.floor(arch * 0.3), centerZ + z, pickColor(plankColors));
        }
      }
      for (const side of [-1, 1]) {
        for (const z of [-4, -3, 3, 4]) {
          addVoxel(centerX + side * 2, 2, centerZ + z, "#302b2a");
        }
        for (let z = -4; z <= 4; z += 1) {
          if (Math.abs(z) === 4 || z === 0) {
            addVoxel(centerX + side * 2, 3, centerZ + z, "#4b4039");
          }
        }
      }
    }

    function buildTrees() {
      for (const tree of layout.trees) {
        const trunkColor = ["#51372d", "#62402f", "#45332d"];
        for (let y = 1; y <= tree.height; y += 1) {
          const lean = y > tree.height - 2 ? randomInteger(-1, 1) : 0;
          addVoxel(tree.x + lean, y, tree.z, pickColor(trunkColor));
        }

        const branchDirections = [
          [1, 0],
          [-1, 0],
          [0, 1],
          [0, -1],
          [1, 1],
          [-1, 1]
        ];
        for (let branch = 0; branch < branchDirections.length; branch += 1) {
          const [dx, dz] = branchDirections[branch];
          if (random() < 0.2) {
            continue;
          }
          const branchY = tree.height - randomInteger(0, 2);
          const branchLength = randomInteger(2, 4);
          addVoxelLine(
            tree.x,
            branchY,
            tree.z,
            tree.x + dx * branchLength,
            branchY + randomInteger(0, 2),
            tree.z + dz * branchLength,
            pickColor(trunkColor)
          );
        }

        const crownCenters = [
          [0, tree.height + 1, 0],
          [-2, tree.height, 1],
          [2, tree.height + 1, -1],
          [0, tree.height + 2, 2],
          [-1, tree.height + 1, -2]
        ];
        for (let crownIndex = 0; crownIndex < crownCenters.length; crownIndex += 1) {
          const [offsetX, centerY, offsetZ] = crownCenters[crownIndex];
          const radius = tree.crown * (crownIndex === 0 ? 1 : randomBetween(0.78, 0.98));
          const integerRadius = Math.ceil(radius);
          for (let dx = -integerRadius; dx <= integerRadius; dx += 1) {
            for (let dy = -integerRadius; dy <= integerRadius; dy += 1) {
              for (let dz = -integerRadius; dz <= integerRadius; dz += 1) {
                const distance = (dx * dx + dy * dy * 1.25 + dz * dz) / (radius * radius);
                if (distance > 1 || random() < 0.075) {
                  continue;
                }
                addVoxel(
                  tree.x + offsetX + dx,
                  centerY + dy,
                  tree.z + offsetZ + dz,
                  pickColor(blossomPalette)
                );
              }
            }
          }
        }
      }
    }

    function buildGardenDetails() {
      let placed = 0;
      let attempts = 0;
      const flowerColors = ["#f6d273", "#f1d6dc", "#e6a6cf", "#f5ede0"];
      while (placed < 275 && attempts < 4500) {
        attempts += 1;
        const x = randomInteger(-20, 20);
        const z = randomInteger(-20, 20);
        if (Math.sqrt(x * x + z * z) > 20) {
          continue;
        }
        const nearPagoda = Math.hypot(x - layout.pagoda.x, z - layout.pagoda.z) < 9;
        const nearPond = Math.hypot(x - layout.pond.x, z - layout.pond.z) < 6.8;
        const nearTorii = Math.hypot(x - layout.torii.x, z - layout.torii.z) < 4;
        const nearTree = layout.trees.some((tree) => Math.hypot(x - tree.x, z - tree.z) < 3.2);
        const onPath = Math.abs(x - layout.pagoda.x) < 3
          && z < layout.pagoda.z - 4
          && z > layout.torii.z + 1;
        if (nearPagoda || nearPond || nearTorii || nearTree || onPath || isPondTile(x, z)) {
          continue;
        }

        const tuftHeight = randomInteger(1, 3);
        const tuftColor = pickColor(grassPalette);
        const offsetX = randomInteger(-1, 1);
        const offsetZ = randomInteger(-1, 1);
        for (let y = 1; y <= tuftHeight; y += 1) {
          addVoxel(x + offsetX, y, z + offsetZ, tuftColor);
        }
        if (random() < 0.42) {
          addVoxel(x + randomInteger(-1, 1), 1, z + randomInteger(-1, 1), pickColor(flowerColors));
        }
        if (random() < 0.18) {
          addVoxel(x + randomInteger(-1, 1), 1, z + randomInteger(-1, 1), "#e7c45e");
        }
        placed += 1;
      }
    }

    function buildKoi() {
      const fishShapes = [
        [
          { x: 1, y: 0, z: 0, color: "#f0e7d3" },
          { x: 0, y: 0, z: 0, color: "#e77735" },
          { x: -1, y: 0, z: 0, color: "#f1eee2" },
          { x: -2, y: 0, z: 0, color: "#d84d32" },
          { x: 0, y: 1, z: 0, color: "#d84d32" },
          { x: 0, y: 0, z: 1, color: "#ec8a3d" },
          { x: 0, y: 0, z: -1, color: "#ec8a3d" },
          { x: 1, y: 1, z: 0, color: "#171f21" },
          { x: -1, y: 1, z: 0, color: "#f0e7d3" }
        ],
        [
          { x: 1, y: 0, z: 0, color: "#f5eee0" },
          { x: 0, y: 0, z: 0, color: "#db5134" },
          { x: -1, y: 0, z: 0, color: "#f2eee0" },
          { x: -2, y: 0, z: 0, color: "#e98737" },
          { x: 0, y: 1, z: 0, color: "#171f21" },
          { x: 0, y: 0, z: 1, color: "#e77735" },
          { x: 0, y: 0, z: -1, color: "#e77735" },
          { x: 1, y: 1, z: 0, color: "#f5eee0" },
          { x: -1, y: 1, z: 0, color: "#db5134" }
        ],
        [
          { x: 1, y: 0, z: 0, color: "#e97937" },
          { x: 0, y: 0, z: 0, color: "#f4eee0" },
          { x: -1, y: 0, z: 0, color: "#dc5136" },
          { x: -2, y: 0, z: 0, color: "#f4eee0" },
          { x: 0, y: 1, z: 0, color: "#e97937" },
          { x: 0, y: 0, z: 1, color: "#ed8a3b" },
          { x: 0, y: 0, z: -1, color: "#ed8a3b" },
          { x: 1, y: 1, z: 0, color: "#151d20" },
          { x: -1, y: 1, z: 0, color: "#f4eee0" }
        ]
      ];
      for (let index = 0; index < fishShapes.length; index += 1) {
        const center = fishShapes[index];
        for (const part of center) {
          koiParts.push({ ...part, fishIndex: index });
        }
        fishMotions.push({ phase: (Math.PI * 2 * index) / fishShapes.length });
      }
    }

    function createVoxelMaterial(options = {}) {
      const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.9,
        metalness: 0.02,
        vertexColors: true,
        ...options
      });
      voxelMaterials.push(material);
      return material;
    }

    function fillStaticMesh() {
      const material = createVoxelMaterial({ roughness: 0.91 });
      const mesh = new THREE.InstancedMesh(boxGeometry, material, staticVoxels.length);
      mesh.name = "Garden voxels";
      mesh.count = staticVoxels.length;
      mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
      for (let index = 0; index < staticVoxels.length; index += 1) {
        const voxel = staticVoxels[index];
        matrixHelper.position.set(voxel.x, voxel.y, voxel.z);
        matrixHelper.rotation.set(0, 0, 0);
        matrixHelper.scale.set(1, 1, 1);
        matrixHelper.updateMatrix();
        mesh.setMatrixAt(index, matrixHelper.matrix);
        colorHelper.set(voxel.color);
        mesh.setColorAt(index, colorHelper);
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) {
        mesh.instanceColor.needsUpdate = true;
      }
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      worldMeshes.push(mesh);
      return mesh;
    }

    function fillWaterMesh() {
      const material = createVoxelMaterial({
        color: 0xffffff,
        roughness: 0.27,
        metalness: 0.05,
        transparent: true,
        opacity: 0.84,
        depthWrite: false
      });
      const mesh = new THREE.InstancedMesh(boxGeometry, material, waterBlocks.length);
      mesh.name = "Pond water voxels";
      mesh.count = waterBlocks.length;
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      for (let index = 0; index < waterBlocks.length; index += 1) {
        const block = waterBlocks[index];
        matrixHelper.position.set(block.x, block.baseY, block.z);
        matrixHelper.rotation.set(0, 0, 0);
        matrixHelper.scale.set(1, 1, 1);
        matrixHelper.updateMatrix();
        mesh.setMatrixAt(index, matrixHelper.matrix);
        colorHelper.set(block.color);
        mesh.setColorAt(index, colorHelper);
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) {
        mesh.instanceColor.needsUpdate = true;
      }
      mesh.castShadow = false;
      mesh.receiveShadow = true;
      mesh.frustumCulled = false;
      scene.add(mesh);
      worldMeshes.push(mesh);
      return mesh;
    }

    function fillKoiMesh() {
      const material = createVoxelMaterial({ roughness: 0.52, metalness: 0.01 });
      const mesh = new THREE.InstancedMesh(boxGeometry, material, koiParts.length);
      mesh.name = "Swimming voxel koi";
      mesh.count = koiParts.length;
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      for (let index = 0; index < koiParts.length; index += 1) {
        const part = koiParts[index];
        matrixHelper.position.set(part.x, part.y, part.z);
        matrixHelper.rotation.set(0, 0, 0);
        matrixHelper.scale.set(1, 1, 1);
        matrixHelper.updateMatrix();
        mesh.setMatrixAt(index, matrixHelper.matrix);
        colorHelper.set(part.color);
        mesh.setColorAt(index, colorHelper);
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) {
        mesh.instanceColor.needsUpdate = true;
      }
      mesh.castShadow = false;
      mesh.receiveShadow = true;
      mesh.frustumCulled = false;
      scene.add(mesh);
      worldMeshes.push(mesh);
      return mesh;
    }

    function buildWorld(nextSeed) {
      activeSeed = nextSeed >>> 0;
      random = mulberry32(activeSeed);
      staticVoxels.length = 0;
      waterBlocks.length = 0;
      koiParts.length = 0;
      fishMotions.length = 0;
      for (const mesh of worldMeshes) {
        scene.remove(mesh);
        mesh.material.dispose();
      }
      worldMeshes.length = 0;
      voxelMaterials.length = 0;

      layout = makeLayout();
      buildIsland();
      buildPond();
      buildStonePath();
      buildPagoda();
      buildBridge();
      buildTorii();
      buildTrees();
      buildGardenDetails();
      buildKoi();

      fillStaticMesh();
      fillWaterMesh();
      fillKoiMesh();
      staticVoxelCount = staticVoxels.length;
      waterVoxelCount = waterBlocks.length;
      koiVoxelCount = koiParts.length;
      seedBadge.textContent = `seed ${activeSeed.toString(16).padStart(8, "0")}`;
      initializeAmbientEffects(activeSeed);
      updateWorldMaterialMode();
      renderer.shadowMap.enabled = shadowsInput.checked;
      sunLight.castShadow = shadowsInput.checked;
      cameraFlight = null;
      controls.enabled = true;
      updateStatusLine();
    }

    const hemisphereLight = new THREE.HemisphereLight("#d8efff", "#514942", 0.7);
    scene.add(hemisphereLight);

    const ambientLight = new THREE.AmbientLight("#ffffff", 0.16);

    ];

    function colorAtHour(hour, property) {
      for (let index = 0; index < skyKeys.length - 1; index += 1) {
        const left = skyKeys[index];
        const right = skyKeys[index + 1];
        if (hour >= left.time && hour <= right.time) {
          const amount = (hour - left.time) / (right.time - left.time);
          return new THREE.Color(left[property]).lerp(new THREE.Color(right[property]), amount);
        }
      }
      return new THREE.Color(skyKeys[0][property]);
    }

    function updateDayNight() {
      const hour = currentTime;
      const daylight = clamp(Math.sin(((hour - 6) / 12) * Math.PI), 0, 1);
      const dawnWeight = 1 - smoothstep(0.2, 1.65, Math.abs(hour - 6.1));
      const duskWeight = 1 - smoothstep(0.2, 1.8, Math.abs(hour - 18.2));
      const warmWeight = Math.max(dawnWeight, duskWeight);
      const nightWeight = 1 - daylight;

      scene.background.copy(colorAtHour(hour, "sky"));
      scene.fog.color.copy(colorAtHour(hour, "fog"));
      const sunColor = colorAtHour(hour, "sun");
      sunLight.color.copy(sunColor);
      sunLight.intensity = 0.08 + daylight * 1.35 + warmWeight * 0.25;
      sunLight.position.set(
        Math.cos(((hour - 12) / 12) * Math.PI) * 52,
        Math.sin(((hour - 6) / 12) * Math.PI) * 42,
        24
      );
      sunLight.target.position.set(0, 0, 0);
      moonLight.intensity = 0.05 + nightWeight * 0.28;
      moonLight.position.set(-sunLight.position.x, Math.max(14, -sunLight.position.y + 18), -34);
      hemisphereLight.color.copy(colorAtHour(hour, "sky")).lerp(new THREE.Color("#e0e8f1"), 0.34);
      hemisphereLight.groundColor.set(daylight > 0.2 ? "#625446" : "#293249");
      hemisphereLight.intensity = 0.24 + daylight * 0.53;
      ambientLight.intensity = 0.055 + daylight * 0.3;
      fireflyMaterial.opacity = firefliesInput.checked ? nightFireflyAmount(hour) * 0.94 : 0;
      updateTimeLabels();
    }

    function nightFireflyAmount(hour) {
      const afterDusk = smoothstep(18.05, 20.35, hour);
      const beforeDawn = 1 - smoothstep(4.65, 6.35, hour);
      return Math.max(afterDusk, beforeDawn);
    }

    function initializeAmbientEffects(seed) {
      const effectRandom = mulberry32((seed ^ 0xA5A5F00D) >>> 0);
      if (fireflyPoints) {
        scene.remove(fireflyPoints);
        fireflyPoints.geometry.dispose();
        fireflyMaterial.dispose();
      }
      petalStates = [];
      for (let index = 0; index < 3000; index += 1) {
        const angle = effectRandom() * Math.PI * 2;
        const radius = Math.sqrt(effectRandom()) * 24;
        petalStates.push({
          x: Math.cos(angle) * radius,
          y: effectRandom() * 17 - 2,
          z: Math.sin(angle) * radius,
          rotationX: effectRandom() * Math.PI * 2,
          rotationY: effectRandom() * Math.PI * 2,
          rotationZ: effectRandom() * Math.PI * 2,
          fallSpeed: 0.35 + effectRandom() * 0.55,
          spinX: (effectRandom() - 0.5) * 2.6,
          spinY: (effectRandom() - 0.5) * 2.2,
          spinZ: (effectRandom() - 0.5) * 2.8,
          swayPhase: effectRandom() * Math.PI * 2,
          scaleX: 0.25 + effectRandom() * 0.18,
          scaleY: 0.08 + effectRandom() * 0.04,
          scaleZ: 0.24 + effectRandom() * 0.18,
          color: petalPalette[Math.floor(effectRandom() * petalPalette.length)]
        });
      }

      const petalMaterial = createVoxelMaterial({ roughness: 0.8, side: THREE.DoubleSide });
      if (petalMesh) {
        scene.remove(petalMesh);
        petalMesh.material.dispose();
      }
      petalMesh = new THREE.InstancedMesh(boxGeometry, petalMaterial, 3000);
      petalMesh.name = "Falling cherry petals";
      petalMesh.count = currentPetalCount;
      petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      for (let index = 0; index < petalStates.length; index += 1) {
        colorHelper.set(petalStates[index].color);
        petalMesh.setColorAt(index, colorHelper);
      }
      petalMesh.instanceColor.needsUpdate = true;
      petalMesh.castShadow = false;
      petalMesh.receiveShadow = false;
      petalMesh.frustumCulled = false;
      scene.add(petalMesh);

      fireflyStates = [];
      const fireflyPositions = new Float32Array(80 * 3);
      const fireflyColors = new Float32Array(80 * 3);
      for (let index = 0; index < 80; index += 1) {
        const angle = effectRandom() * Math.PI * 2;
        const radius = Math.sqrt(effectRandom()) * 20;
        const state = {
          x: Math.cos(angle) * radius,
          y: 1.2 + effectRandom() * 8,
          z: Math.sin(angle) * radius,
          phase: effectRandom() * Math.PI * 2,
          speed: 0.3 + effectRandom() * 0.7,
          radius: 0.18 + effectRandom() * 0.42
        };
        fireflyStates.push(state);
        fireflyPositions[index * 3] = state.x;
        fireflyPositions[index * 3 + 1] = state.y;
        fireflyPositions[index * 3 + 2] = state.z;
        const fireflyColor = new THREE.Color(index % 4 === 0 ? "#ffda83" : "#c4f0bc");
        fireflyColors[index * 3] = fireflyColor.r;
        fireflyColors[index * 3 + 1] = fireflyColor.g;
        fireflyColors[index * 3 + 2] = fireflyColor.b;
      }

      const fireflyGeometry = new THREE.BufferGeometry();
      fireflyGeometry.setAttribute("position", new THREE.BufferAttribute(fireflyPositions, 3));
      fireflyGeometry.setAttribute("color", new THREE.BufferAttribute(fireflyColors, 3));
      fireflyGeometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
      fireflyMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.38,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      fireflyPoints = new THREE.Points(fireflyGeometry, fireflyMaterial);
      fireflyPoints.name = "Night fireflies";
      fireflyPoints.frustumCulled = false;
      scene.add(fireflyPoints);
      updateWorldMaterialMode();
    }

    function updateWorldMaterialMode() {
      const wireframe = wireframeInput.checked;
      for (const material of voxelMaterials) {
        material.wireframe = wireframe;
        material.needsUpdate = true;
      }
    }

    function updatePetals(deltaSeconds) {
      if (!petalMesh) {
        return;
      }
      const wind = Number(windSlider.value);
      const windDrift = 0.1 + wind * 0.68;
      for (let index = 0; index < currentPetalCount; index += 1) {
        const petal = petalStates[index];
        petal.y -= petal.fallSpeed * deltaSeconds;
        petal.x += windDrift * deltaSeconds
          + Math.sin(elapsedSeconds * 1.4 + petal.swayPhase) * 0.11 * deltaSeconds;
        petal.z += Math.sin(elapsedSeconds * 0.8 + petal.swayPhase) * (0.05 + wind * 0.16) * deltaSeconds;
        petal.rotationX += petal.spinX * deltaSeconds;
        petal.rotationY += petal.spinY * deltaSeconds;
        petal.rotationZ += petal.spinZ * deltaSeconds;

        if (petal.y < -30) {
          const angle = random() * Math.PI * 2;
          const radius = Math.sqrt(random()) * 24;
          petal.x = Math.cos(angle) * radius;
          petal.z = Math.sin(angle) * radius;
          petal.y = 12 + random() * 10;
        }

        matrixHelper.position.set(petal.x, petal.y, petal.z);
        matrixHelper.rotation.set(petal.rotationX, petal.rotationY, petal.rotationZ);
        matrixHelper.scale.set(petal.scaleX, petal.scaleY, petal.scaleZ);
        matrixHelper.updateMatrix();
        petalMesh.setMatrixAt(index, matrixHelper.matrix);
      }
      petalMesh.instanceMatrix.needsUpdate = true;
    }

    function updateWater(elapsed) {
      const waterMesh = worldMeshes.find((mesh) => mesh.name === "Pond water voxels");
      if (!waterMesh) {
        return;
      }
      for (let index = 0; index < waterBlocks.length; index += 1) {
        const block = waterBlocks[index];
        const bob = waterAnimInput.checked
          ? Math.sin(elapsed * 1.45 + block.phase) * 0.045
          : 0;
        matrixHelper.position.set(block.x, block.baseY + bob, block.z);
        matrixHelper.rotation.set(0, 0, 0);
        matrixHelper.scale.set(1, 1, 1);
        matrixHelper.updateMatrix();
        waterMesh.setMatrixAt(index, matrixHelper.matrix);
      }
      waterMesh.instanceMatrix.needsUpdate = true;
    }

    function updateKoi(elapsed) {
      const koiMesh = worldMeshes.find((mesh) => mesh.name === "Swimming voxel koi");
      if (!koiMesh || !layout) {
        return;
      }
      const pond = layout.pond;
      for (let index = 0; index < koiParts.length; index += 1) {
        const part = koiParts[index];
        const motion = fishMotions[part.fishIndex];
        const phase = elapsed * (0.38 + part.fishIndex * 0.035) + motion.phase;
        const centerX = pond.x + Math.sin(phase) * 1.35;
        const centerZ = pond.z + Math.cos(phase) * 1.08;
        const directionX = Math.cos(phase);
        const directionZ = -Math.sin(phase);
        const yaw = Math.atan2(-directionZ, directionX);
        const cosine = Math.cos(yaw);
        const sine = Math.sin(yaw);
        const rotatedX = part.x * cosine + part.z * sine;
        const rotatedZ = -part.x * sine + part.z * cosine;
        matrixHelper.position.set(
          centerX + rotatedX,
          -1.0 + Math.sin(phase * 1.7) * 0.08 + part.y,
          centerZ + rotatedZ
        );
        matrixHelper.rotation.set(0, yaw, 0);
        matrixHelper.scale.set(1, 1, 1);
        matrixHelper.updateMatrix();
        koiMesh.setMatrixAt(index, matrixHelper.matrix);
      }
      koiMesh.instanceMatrix.needsUpdate = true;
    }

    function updateFireflies(elapsed) {
      if (!fireflyPoints) {
        return;
      }
      const positions = fireflyPoints.geometry.attributes.position.array;
      for (let index = 0; index < fireflyStates.length; index += 1) {
        const fly = fireflyStates[index];
        const phase = elapsed * fly.speed + fly.phase;
        positions[index * 3] = fly.x + Math.sin(phase * 0.73) * fly.radius;
        positions[index * 3 + 1] = fly.y + Math.sin(phase * 1.31) * 0.55;
        positions[index * 3 + 2] = fly.z + Math.cos(phase * 0.87) * fly.radius;
      }
      fireflyPoints.geometry.attributes.position.needsUpdate = true;
      fireflyMaterial.opacity = firefliesInput.checked
        ? nightFireflyAmount(currentTime) * (0.72 + Math.sin(elapsed * 1.2) * 0.12)
        : 0;
    }

    function cameraPresets() {
      const pagoda = layout.pagoda;
      const pond = layout.pond;
      const gate = layout.torii;
      const blossomTree = layout.trees[2];
      return [
        {
          position: new THREE.Vector3(43, 33, 49),
          target: new THREE.Vector3(0, -1.3, 0)
        },
        {
          position: new THREE.Vector3(pagoda.x + 24, 23, pagoda.z + 29),
          target: new THREE.Vector3(pagoda.x, 10.5, pagoda.z)
        },
        {
          position: new THREE.Vector3(pond.x + 14, 13, pond.z + 16),
          target: new THREE.Vector3(pond.x, 0.4, pond.z)
        },
        {
          position: new THREE.Vector3(gate.x + 17, 12, gate.z + 18),
          target: new THREE.Vector3(gate.x, 4.8, gate.z)
        },
        {
          position: new THREE.Vector3(blossomTree.x + 12, 12, blossomTree.z + 13),
          target: new THREE.Vector3(blossomTree.x, 7.2, blossomTree.z)
        }
      ];
    }

    function flyToPreset(index) {
      const preset = cameraPresets()[index];
      if (!preset) {
        return;
      }
      cameraFlight = {
        fromPosition: camera.position.clone(),
        toPosition: preset.position,
        fromTarget: controls.target.clone(),
        toTarget: preset.target,
        startedAt: performance.now(),
        duration: 1200
      };
      controls.enabled = false;
    }

    function updateCameraFlight(now) {
      if (!cameraFlight) {
        return;
      }
      const rawProgress = clamp((now - cameraFlight.startedAt) / cameraFlight.duration, 0, 1);
      const eased = 1 - Math.pow(1 - rawProgress, 3);
      camera.position.lerpVectors(cameraFlight.fromPosition, cameraFlight.toPosition, eased);
      controls.target.lerpVectors(cameraFlight.fromTarget, cameraFlight.toTarget, eased);
      if (rawProgress >= 1) {
        cameraFlight = null;
        controls.enabled = true;
      }
    }

    function updateStatusLine() {
      const total = staticVoxelCount + waterVoxelCount + koiVoxelCount + currentPetalCount;
      statusLine.innerHTML = `voxels: ${total.toLocaleString("en-US")} &nbsp; ${lastClockLabel} &nbsp; fps: ${displayedFps}`;
    }

    function updateFps(deltaSeconds) {
      fpsFrames += 1;
      fpsElapsed += deltaSeconds;
      if (fpsElapsed >= 1) {
        displayedFps = Math.round(fpsFrames / fpsElapsed);
        fpsFrames = 0;
        fpsElapsed = 0;
        updateStatusLine();
      }
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const deltaSeconds = Math.min(timeClock.getDelta(), 0.05);
      elapsedSeconds += deltaSeconds;
      if (cyclePlaying) {
        currentTime = (currentTime + deltaSeconds * Number(speedSlider.value) * 0.15) % 24;
        timeSlider.value = String(currentTime);
      }
      updateDayNight();
      updateCameraFlight(now);
      if (controls.enabled) {
        controls.update();
      }
      updateWater(elapsedSeconds);
      updateKoi(elapsedSeconds);
      updatePetals(deltaSeconds);
      updateFireflies(elapsedSeconds);
      updateFps(deltaSeconds);
      renderer.render(scene, camera);
    }

    function updateStatusForTimeInput() {
      updateTimeLabels();
      updateStatusLine();
    }

    timeSlider.addEventListener("input", () => {
      currentTime = Number(timeSlider.value);
      updateStatusForTimeInput();
    });

    speedSlider.addEventListener("input", () => {
      speedValue.value = `${Number(speedSlider.value).toFixed(2).replace(/0+$/, "").replace(/\.$/, "")}×`;
      speedValue.textContent = speedValue.value;
    });

    playButton.addEventListener("click", () => {
      cyclePlaying = !cyclePlaying;
      playButton.setAttribute("aria-pressed", String(cyclePlaying));
      playButton.textContent = cyclePlaying ? "❚❚ Pause cycle" : "▶ Play cycle";
    });

    petalSlider.addEventListener("input", () => {
      currentPetalCount = Number(petalSlider.value);
      petalValue.value = currentPetalCount.toLocaleString("en-US");
      petalValue.textContent = petalValue.value;
      if (petalMesh) {
        petalMesh.count = currentPetalCount;
      }
      updateStatusLine();
    });

    windSlider.addEventListener("input", () => {
      windValue.value = Number(windSlider.value).toFixed(2);
      windValue.textContent = windValue.value;
    });

    autoRotateInput.addEventListener("change", () => {
      controls.autoRotate = autoRotateInput.checked;
    });

    shadowsInput.addEventListener("change", () => {
      renderer.shadowMap.enabled = shadowsInput.checked;
      sunLight.castShadow = shadowsInput.checked;
      renderer.shadowMap.needsUpdate = true;
    });

    firefliesInput.addEventListener("change", () => {
      if (fireflyMaterial) {
        fireflyMaterial.opacity = firefliesInput.checked ? nightFireflyAmount(currentTime) : 0;
      }
    });

    wireframeInput.addEventListener("change", updateWorldMaterialMode);

    document.querySelectorAll("[data-preset]").forEach((button) => {
      button.addEventListener("click", () => {
        flyToPreset(Number(button.dataset.preset));
      });
    });

    document.getElementById("regenerate").addEventListener("click", () => {
      activeSeed = (activeSeed + 0x9E3779B9) >>> 0;
      buildWorld(activeSeed);
    });

    document.getElementById("reset-view").addEventListener("click", () => {
      flyToPreset(0);
    });

    window.addEventListener("keydown", (event) => {
      const target = event.target;
      const isFormControl = target instanceof HTMLElement
        && (target.matches("input, select, textarea") || target.isContentEditable);
      if (isFormControl || event.altKey || event.ctrlKey || event.metaKey) {
        return;
      }
      const presetNumber = Number(event.key);
      if (presetNumber >= 1 && presetNumber <= 5) {
        flyToPreset(presetNumber - 1);
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    currentTime = Number(timeSlider.value);
    currentPetalCount = Number(petalSlider.value);
    petalValue.value = currentPetalCount.toLocaleString("en-US");
    petalValue.textContent = petalValue.value;
    speedValue.value = "1×";
    speedValue.textContent = speedValue.value;
    windValue.value = Number(windSlider.value).toFixed(2);
    windValue.textContent = windValue.value;
    updateTimeLabels();
    buildWorld(activeSeed);
    updateDayNight();
    requestAnimationFrame((now) => {
      previousFrameTime = now;
      animate(now);
    });
  </script>
</body>
</html>
