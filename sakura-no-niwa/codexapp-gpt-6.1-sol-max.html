<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c4dce1">
  <meta name="description" content="A little Japanese garden suspended in the sky. Explore a five-tier voxel pagoda, cherry blossoms, and a koi pond through a full day and night.">
  <title>桜の庭 — Voxel Pagoda Garden</title>
  <style>
    :root { color-scheme: dark; --scene-ink: #344c50; --accent: #e9b6b8; --panel-text: #ecf0e9; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #c4dce1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 2px solid #f5d8b7; outline-offset: 4px; }
    #garden { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    .controls { position: fixed; z-index: 3; top: 24px; left: 24px; width: 274px; overflow: hidden; color: var(--panel-text); background: rgba(26, 38, 39, .84); border: 1px solid rgba(241, 247, 236, .18); border-radius: 15px; box-shadow: 0 12px 42px #1b30332a, inset 0 1px 0 #ffffff09; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 17px 18px 14px; }
    .panel-title { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; letter-spacing: .025em; }
    .panel-title svg { width: 16px; height: 16px; color: #c3d3c8; }
    .fold { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #b5c6bf; cursor: pointer; }
    .fold:hover { background: #ffffff10; }
    .fold svg { width: 12px; transition: transform .2s; }
    .controls.collapsed .fold svg { transform: rotate(180deg); }
    .controls.collapsed #panel-body { display: none; }
    #panel-body { padding: 0 18px 14px; max-height: calc(100dvh - 108px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: #6d8179 transparent; }
    .control { margin: 0 0 17px; }
    .control-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 11px; font-weight: 500; color: #dde5dc; }
    output { color: #f4d5c2; font-variant-numeric: tabular-nums; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 10px; }
    input[type="range"] { --fill: 50%; display: block; width: 100%; height: 4px; margin: 6px 0 0; padding: 0; appearance: none; -webkit-appearance: none; border-radius: 10px; background: linear-gradient(90deg, #d9b5a1 0 var(--fill), #ffffff20 var(--fill) 100%); cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; width: 11px; height: 11px; border: 2px solid #f4e1ce; border-radius: 50%; background: #d8b4a0; box-shadow: 0 1px 4px #0004; }
    input[type="range"]::-moz-range-thumb { width: 8px; height: 8px; border: 2px solid #f4e1ce; border-radius: 50%; background: #d8b4a0; }
    .cycle-row { display: flex; align-items: center; gap: 13px; margin: 15px 0 22px; }
    .button { min-height: 31px; padding: 7px 9px; color: #d9e3d9; border: 1px solid #cddfce25; border-radius: 6px; background: #d0dfce09; font-size: 10px; line-height: 1.1; cursor: pointer; transition: background .18s, border-color .18s, color .18s; }
    .button:hover { background: #d8e6d01a; border-color: #dbe6d45c; }
    .button:active { background: #d8e6d02b; }
    .button:disabled { cursor: wait; opacity: .55; }
    .button[aria-pressed="true"] { background: #dec1a91e; border-color: #e5c5a75c; color: #ffe8cf; }
    #cycle { flex: 0 0 115px; text-align: center; }
    .speed { flex: 1; min-width: 0; }
    .speed .control-label { margin-bottom: 5px; font-size: 9px; color: #a9beb1; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin: 21px 0 22px; }
    .checks label { display: flex; align-items: center; gap: 7px; width: max-content; color: #d9e3d7; font-size: 10px; cursor: pointer; }
    input[type="checkbox"] { width: 12px; height: 12px; margin: 0; accent-color: #cbb28d; cursor: pointer; }
    .section-label { display: flex; align-items: center; gap: 9px; margin: 0 0 10px; color: #a5b9ae; font-size: 8px; letter-spacing: .18em; }
    .section-label::after { content: ""; height: 1px; flex: 1; background: #dae6d71c; }
    .presets { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .presets .button { padding: 8px 4px; font-size: 9px; white-space: nowrap; }
    .presets .button span { margin-right: 3px; color: #cdb69c; font-size: 8px; }
    .preset-second { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .preset-second .button { font-size: 9px; }
    .preset-second .button span { margin-right: 5px; color: #cdb69c; font-size: 8px; }
    .actions { display: grid; grid-template-columns: 1.2fr 1fr; gap: 6px; margin: 16px 0 14px; }
    .actions .button { font-size: 9px; }
    .status { display: flex; justify-content: space-between; align-items: center; gap: 5px; padding-top: 11px; border-top: 1px solid #dae6d71c; color: #a3b8a9; font: 9px/1.4 ui-monospace, "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .status .dot { display: inline-block; width: 4px; height: 4px; margin-right: 4px; border-radius: 50%; background: #b8ce9c; box-shadow: 0 0 6px #b8ce9c55; vertical-align: 1px; }
    .scene-title { position: fixed; z-index: 1; top: 33px; right: 37px; color: var(--scene-ink); text-align: right; pointer-events: none; user-select: none; }
    .scene-title .eyebrow { margin: 0 4px 12px 0; font-size: 8px; letter-spacing: .28em; opacity: .6; }
    .scene-title h1 { margin: 0; font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", "Times New Roman", serif; font-size: clamp(43px, 5vw, 74px); font-weight: 400; line-height: 1.25; letter-spacing: .15em; }
    .scene-title .subtitle { margin: 12px 7px 0 0; font-size: 9px; letter-spacing: .27em; opacity: .75; }
    .scene-title .seal { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin: 19px 8px 0 0; border: 1px solid currentColor; font-family: serif; font-size: 11px; opacity: .55; }
    .hint { position: fixed; z-index: 1; bottom: 23px; left: 50%; display: flex; align-items: center; gap: 19px; transform: translateX(-50%); color: var(--scene-ink); font-size: 8px; letter-spacing: .12em; white-space: nowrap; pointer-events: none; opacity: .7; }
    .hint span + span::before { content: "·"; margin-right: 19px; opacity: .5; }
    .signature { position: fixed; z-index: 1; right: 29px; bottom: 22px; color: var(--scene-ink); font: 8px ui-monospace, monospace; letter-spacing: .06em; pointer-events: none; opacity: .55; }
    .loading { position: fixed; z-index: 6; inset: 0; display: grid; place-content: center; gap: 16px; justify-items: center; background: #d4e5e7; color: #3e5755; transition: opacity .6s, visibility .6s; }
    .loading.ready { opacity: 0; visibility: hidden; }
    .loading-mark { display: grid; grid-template-columns: repeat(3, 8px); gap: 4px; transform: rotate(-9deg); }
    .loading-mark i { width: 8px; height: 8px; background: #bc838f; animation: breathe 1.4s ease-in-out infinite alternate; }
    .loading-mark i:nth-child(2n) { animation-delay: -.5s; background: #d1a1a8; }
    .loading p { font-size: 10px; letter-spacing: .16em; }
    @keyframes breathe { to { opacity: .35; transform: translateY(-4px); } }
    #error { position: fixed; z-index: 9; left: 50%; top: 50%; width: min(370px, calc(100% - 38px)); padding: 22px; transform: translate(-50%, -50%); border: 1px solid #d6b19b77; border-radius: 12px; background: #213331f5; color: #f2e4cf; font-size: 13px; line-height: 1.6; box-shadow: 0 12px 50px #0004; }
    #error[hidden] { display: none; }
    @media (max-width: 700px) {
      .controls { top: 13px; left: 13px; width: 242px; border-radius: 11px; }
      .panel-head { padding: 13px 14px 12px; }
      #panel-body { padding: 0 14px 12px; max-height: calc(100dvh - 88px); }
      .control { margin-bottom: 15px; }
      .checks { gap: 11px 7px; margin: 19px 0; }
      .cycle-row { gap: 10px; }
      #cycle { flex-basis: 103px; }
      .scene-title { top: 25px; right: 16px; }
      .scene-title h1 { font-size: 41px; letter-spacing: .08em; }
      .scene-title .eyebrow, .scene-title .seal { display: none; }
      .scene-title .subtitle { max-width: 130px; margin-right: 0; font-size: 7px; letter-spacing: .14em; line-height: 1.7; }
      .hint { bottom: 18px; font-size: 7px; gap: 10px; }
      .hint span + span::before { margin-right: 10px; }
      .signature { display: none; }
    }
    @media (max-width: 440px) {
      .controls { width: 219px; left: 10px; top: 10px; }
      .panel-head { padding: 12px; }
      #panel-body { padding: 0 12px 11px; }
      .scene-title { right: 12px; top: 22px; }
      .scene-title h1 { font-size: 34px; }
      .scene-title .subtitle { max-width: 111px; font-size: 6px; }
      .status { font-size: 8px; }
      .checks label { font-size: 9px; }
      #cycle { flex-basis: 94px; font-size: 9px; }
      .hint span:last-child { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .loading-mark i { animation: none; } * { scroll-behavior: auto; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="garden" aria-label="Interactive floating voxel Japanese garden. Drag to orbit, scroll to zoom, and use keys one through five for camera views."></canvas>
  <aside class="controls" aria-label="Garden controls">
    <header class="panel-head">
      <div class="panel-title"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.2"/><circle cx="7" cy="5" r="2" fill="#273b36" stroke="currentColor"/><circle cx="13" cy="10" r="2" fill="#273b36" stroke="currentColor"/><circle cx="8" cy="15" r="2" fill="#273b36" stroke="currentColor"/></svg>Controls</div>
      <button class="fold" id="fold" type="button" aria-label="Collapse controls" aria-expanded="true" aria-controls="panel-body"><svg viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="m2 6 4-4 4 4" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </header>
    <div id="panel-body">
      <div class="control">
        <label class="control-label" for="time"><span>Time</span><output id="time-value" for="time">10:30</output></label>
        <input id="time" type="range" min="0" max="24" value="10.5" step="0.01" aria-label="Time of day">
      </div>
      <div class="cycle-row">
        <button id="cycle" class="button" type="button" aria-pressed="false">▶ Play cycle</button>
        <div class="speed">
          <label class="control-label" for="speed"><span>speed</span><output id="speed-value" for="speed">1.0×</output></label>
          <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1" aria-label="Day and night cycle speed">
        </div>
      </div>
      <div class="control">
        <label class="control-label" for="petals"><span>Petals</span><output id="petals-value" for="petals">1,100</output></label>
        <input id="petals" type="range" min="0" max="3000" value="1100" step="50">
      </div>
      <div class="control">
        <label class="control-label" for="wind"><span>Wind</span><output id="wind-value" for="wind">0.28</output></label>
        <input id="wind" type="range" min="0" max="1" value="0.28" step="0.01">
      </div>
      <div class="checks">
        <label><input id="auto-rotate" type="checkbox">Auto-rotate</label>
        <label><input id="shadows" type="checkbox" checked>Shadows</label>
        <label><input id="fireflies" type="checkbox" checked>Fireflies</label>
        <label><input id="water-anim" type="checkbox" checked>Water anim</label>
        <label><input id="wireframe" type="checkbox">Wireframe</label>
      </div>
      <p class="section-label">CAMERA VIEWS</p>
      <div class="presets" role="group" aria-label="Camera views, first row">
        <button class="button preset" data-preset="1" type="button" aria-pressed="true"><span>1</span>Overview</button>
        <button class="button preset" data-preset="2" type="button" aria-pressed="false"><span>2</span>Pagoda</button>
        <button class="button preset" data-preset="3" type="button" aria-pressed="false"><span>3</span>Pond</button>
      </div>
      <div class="preset-second" role="group" aria-label="Camera views, second row">
        <button class="button preset" data-preset="4" type="button" aria-pressed="false"><span>4</span>Torii</button>
        <button class="button preset" data-preset="5" type="button" aria-pressed="false"><span>5</span>Blossoms</button>
      </div>
      <div class="actions">
        <button id="regenerate" class="button" type="button">↻ Regenerate seed</button>
        <button id="reset" class="button" type="button">Reset view</button>
      </div>
      <div class="status" role="status" aria-live="off"><span><i class="dot"></i>voxels: <b id="voxel-count">—</b></span><span id="status-time">10:30</span><span>fps: <b id="fps">—</b></span></div>
    </div>
  </aside>
  <div class="scene-title" aria-hidden="true"><p class="eyebrow">A WORLD IN BLOOM</p><h1 lang="ja">桜の庭</h1><p class="subtitle">VOXEL PAGODA GARDEN</p><span class="seal">春</span></div>
  <div class="hint" aria-hidden="true"><span>DRAG TO ORBIT</span><span>SCROLL TO ZOOM</span><span>1–5 TO WANDER</span></div>
  <div class="signature" id="seed-label" aria-hidden="true">SEED 1A2B3C</div>
  <div class="loading" id="loading"><div class="loading-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p>GROWING YOUR GARDEN</p></div>
  <div id="error" role="alert" hidden></div>
  <script>
    function gardenLoadError(message) {
      document.getElementById('loading').classList.add('ready');
      const notice = document.getElementById('error');
      notice.textContent = message;
      notice.hidden = false;
    }
    window.addEventListener('error', function (event) {
      if (event.message && /WebGL|context|Failed to fetch dynamically imported module/i.test(event.message)) {
        gardenLoadError('The garden could not start. Please use a WebGL-capable browser and check that jsDelivr is reachable.');
      }
    });
  </script>
  <script type="module" onerror="gardenLoadError('Three.js could not load. Connect to the internet and allow cdn.jsdelivr.net, then reopen this file.')">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Pure, seeded scene generation. Rendering and animation consume this data.
    function mulberry32(seed) {
      return function () {
        let value = seed += 0x6D2B79F5;
        value = Math.imul(value ^ value >>> 15, value | 1);
        value ^= value + Math.imul(value ^ value >>> 7, value | 61);
        return ((value ^ value >>> 14) >>> 0) / 4294967296;
      };
    }

    const PALETTE = {
      grass: ['#769777', '#80a47c', '#8eae80'],
      moss: ['#72866d', '#8c9b7a', '#9eaa87'],
      earth: ['#8b705a', '#9d7c61', '#80654f', '#b18c69'],
      rock: ['#6c7776', '#7b8581', '#87918a', '#586564', '#929990'],
      stone: ['#bdc0af', '#a5ad9d', '#d0cdb9', '#b2b9a6'],
      bark: ['#51403b', '#634b43', '#775647'],
      blossom: ['#e7a9bc', '#f3c5d0', '#f8dedc'],
      blossomShade: ['#c47f9d', '#d38ea9', '#e2a0b7'],
      timber: ['#292e2d', '#383831', '#464239'],
      roof: ['#263436', '#303e3e', '#3b4845', '#243033'],
      plaster: ['#e6dfc9', '#d9dbc9', '#f2e9d4'],
      red: ['#ac4940', '#c05747', '#983c36'],
      bridge: ['#645245', '#76604c', '#56483d'],
      sand: ['#b2ae8d', '#bfc0a1', '#a9af97'],
      water: ['#4a9fa9', '#5baeb7', '#72b9bc', '#4b94a4']
    };

    function createGardenData(seed) {
      const random = mulberry32(seed);
      const pick = values => values[Math.floor(random() * values.length)];
      const integer = (low, high) => low + Math.floor(random() * (high - low + 1));
      const blocks = new Map();
      const water = [];
      const lights = [];
      const put = (x, y, z, color) => blocks.set(x + ',' + y + ',' + z, { x, y, z, color });
      const pagoda = { x: -3 + integer(-1, 1), z: -4 + integer(-1, 1), tiers: 5 };
      const pond = { x: 9 + integer(-1, 1), z: 5 + integer(-1, 1), rx: 6.4, rz: 4.6 };
      const torii = { x: -2 + integer(-1, 1), z: 17 };
      const phase = random() * Math.PI * 2;
      const pondPhase = random() * Math.PI * 2;
      const pondDistance = (x, z) => {
        const dx = (x - pond.x) / pond.rx;
        const dz = (z - pond.z) / pond.rz;
        const angle = Math.atan2(dz, dx);
        return (dx * dx + dz * dz) / (1 + Math.sin(angle * 3 + pondPhase) * .12 + Math.cos(angle * 5 - pondPhase) * .06);
      };
      const edgeRadius = (angle, depth) => {
        const taper = Math.pow(Math.max(.018, 1 - depth / 15), .66);
        const ripple = Math.sin(angle * 3 + phase) * .95 + Math.sin(angle * 7 - phase) * .55 + Math.cos(angle * 11 + phase) * .3;
        return 22 * taper + ripple * (1 - depth / 18);
      };

      for (let depth = 0; depth < 15; depth++) {
        const shiftX = depth * .09;
        const shiftZ = -depth * .055;
        for (let x = -24; x <= 24; x++) {
          for (let z = -24; z <= 24; z++) {
            const dx = x - shiftX;
            const dz = z - shiftZ;
            const radius = edgeRadius(Math.atan2(dz, dx), depth);
            if (Math.hypot(dx, dz) > radius + (random() - .5) * .5) continue;
            const pool = pondDistance(x, z);
            if (depth === 0 && pool < 1) {
              water.push({ x, y: -.28, z, color: pick(PALETTE.water), phase: random() * 6.283 });
              continue;
            }
            let color;
            if (depth === 0) color = pool < 1.32 ? pick(PALETTE.moss) : pick(PALETTE.grass);
            else if (depth === 1 && pool < 1.08) color = pick(PALETTE.sand);
            else if (depth <= 2 || depth === 3 && random() > .45) color = pick(PALETTE.earth);
            else color = pick(PALETTE.rock);
            put(x, -depth, z, color);
          }
        }
      }
      put(1, -15, -1, '#6c7776');
      put(2, -15, -1, '#87918a');
      put(1, -16, -1, '#586564');

      const path = [
        [[torii.x, 20], [torii.x, 12], [pagoda.x, 7], [pagoda.x, pagoda.z + 6]],
        [[torii.x, 12], [pond.x - 1, pond.z + 7], [pond.x - 1, pond.z - 7], [13, -5]]
      ];
      function segmentDistance(x, z, a, b) {
        const vx = b[0] - a[0], vz = b[1] - a[1];
        const ratio = Math.max(0, Math.min(1, ((x - a[0]) * vx + (z - a[1]) * vz) / (vx * vx + vz * vz || 1)));
        return Math.hypot(x - a[0] - ratio * vx, z - a[1] - ratio * vz);
      }
      for (let x = -22; x <= 22; x++) {
        for (let z = -22; z <= 22; z++) {
          if (!blocks.has(x + ',0,' + z) || pondDistance(x, z) < 1) continue;
          let distance = Infinity;
          for (const route of path) {
            for (let i = 1; i < route.length; i++) distance = Math.min(distance, segmentDistance(x, z, route[i - 1], route[i]));
          }
          if (distance < 1.15 && random() > .1 || distance < 1.85 && random() > .82) put(x, 0, z, pick(PALETTE.stone));
          else if (pondDistance(x, z) < 1.28 && random() > .52) put(x, 0, z, pick(PALETTE.stone));
        }
      }

      // A hollow timber frame makes the five plaster-lined storeys legible.
      const px = pagoda.x, pz = pagoda.z;
      for (let x = -7; x <= 7; x++) {
        for (let z = -7; z <= 7; z++) put(px + x, 1, pz + z, pick(PALETTE.stone));
      }
      for (let x = -2; x <= 2; x++) {
        put(px + x, 1, pz + 8, pick(PALETTE.stone));
        put(px + x, 0, pz + 9, pick(PALETTE.stone));
      }
      for (let tier = 0; tier < 5; tier++) {
        const half = 5 - tier;
        const floor = 2 + tier * 6;
        const roof = floor + 3;
        const roofHalf = half + 3;
        for (let x = -half; x <= half; x++) {
          for (let z = -half; z <= half; z++) put(px + x, floor, pz + z, pick(PALETTE.timber));
        }
        for (let height = 1; height <= 2; height++) {
          for (let a = -half; a <= half; a++) {
            for (const side of [-1, 1]) {
              const post = Math.abs(a) === half || (a + half) % 3 === 0;
              const color = post ? pick(PALETTE.timber) : pick(PALETTE.plaster);
              put(px + a, floor + height, pz + side * half, color);
              put(px + side * half, floor + height, pz + a, color);
            }
          }
        }
        // Entrance and warm window recesses retain the dark timber silhouette.
        for (let y = floor + 1; y <= floor + 2; y++) {
          blocks.delete(px + ',' + y + ',' + (pz + half));
          if (tier === 0) blocks.delete((px + 1) + ',' + y + ',' + (pz + half));
        }
        lights.push({ x: px, y: floor + 1, z: pz + half - 1, color: '#e5b877' });
        for (let a = -half - 1; a <= half + 1; a++) {
          for (const side of [-1, 1]) {
            put(px + a, floor, pz + side * (half + 1), '#423c33');
            put(px + side * (half + 1), floor, pz + a, '#423c33');
            if (Math.abs(a) === half + 1 || a % 3 === 0) {
              put(px + a, floor + 1, pz + side * (half + 1), '#75483a');
              put(px + side * (half + 1), floor + 1, pz + a, '#75483a');
            }
          }
        }
        for (let a = -roofHalf + 1; a < roofHalf; a++) {
          for (const side of [-1, 1]) {
            put(px + a, roof - 1, pz + side * (roofHalf - 1), pick(PALETTE.red));
            put(px + side * (roofHalf - 1), roof - 1, pz + a, pick(PALETTE.red));
          }
        }
        for (let x = -roofHalf; x <= roofHalf; x++) {
          for (let z = -roofHalf; z <= roofHalf; z++) {
            const edge = Math.max(Math.abs(x), Math.abs(z));
            let y = roof + Math.floor((roofHalf - edge) / 3);
            const corner = Math.abs(x) >= roofHalf - 1 && Math.abs(z) >= roofHalf - 1;
            if (corner) y++;
            const color = edge === roofHalf ? '#3e4b47' : pick(PALETTE.roof);
            put(px + x, y, pz + z, color);
            if (edge === roofHalf - 1 && !corner) put(px + x, y - 1, pz + z, '#303734');
          }
        }
        for (const x of [-1, 1]) {
          for (const z of [-1, 1]) put(px + x * roofHalf, roof + 2, pz + z * roofHalf, '#4b5145');
        }
      }
      for (let y = 31; y <= 37; y++) put(px, y, pz, y % 2 ? '#423f31' : '#a48b5a');
      for (const y of [32, 34]) {
        for (const offset of [-1, 1]) {
          put(px + offset, y, pz, '#91815c');
          put(px, y, pz + offset, '#91815c');
        }
      }
      put(px, 38, pz, '#cead72');

      // A red torii and black curved lintel face the approaching stone path.
      for (const side of [-1, 1]) {
        for (let y = 1; y <= 9; y++) put(torii.x + side * 4, y, torii.z, y <= 2 ? '#293431' : pick(PALETTE.red));
        for (const offset of [-1, 1]) put(torii.x + side * 4 + offset, 1, torii.z, '#434a40');
      }
      for (let x = -7; x <= 7; x++) {
        put(torii.x + x, 9 + (Math.abs(x) > 5 ? 1 : 0), torii.z, pick(PALETTE.red));
        put(torii.x + x, 10 + (Math.abs(x) > 5 ? 1 : 0), torii.z, '#293432');
        if (Math.abs(x) < 6) put(torii.x + x, 7, torii.z, pick(PALETTE.red));
      }
      put(torii.x, 8, torii.z, '#332f29');
      put(torii.x, 8, torii.z + 1, '#9c7e4f');

      // Planks climb gently over the pond. Open handrails leave the koi visible.
      const bridgeX = pond.x - 1;
      for (let step = -6; step <= 6; step++) {
        const deck = Math.abs(step) <= 2 ? 2 : 1;
        for (let width = -1; width <= 1; width++) put(bridgeX + width, deck, pond.z + step, pick(PALETTE.bridge));
        for (const side of [-1, 1]) {
          put(bridgeX + side * 2, deck + 2, pond.z + step, '#5c473b');
          if (step % 3 === 0) {
            put(bridgeX + side * 2, deck + 1, pond.z + step, '#4f4035');
            put(bridgeX + side * 2, deck + 3, pond.z + step, '#7d5f48');
          }
          if (step === -3 || step === 3) {
            for (let y = -1; y <= deck; y++) put(bridgeX + side * 2, y, pond.z + step, '#574c40');
          }
        }
      }

      const anchors = [
        [-14, 7, 7, 5.4], [15, -6, 8, 5.5], [-13, -12, 7, 5.3],
        [5, -15, 7, 4.7], [15, 12, 6, 4.6]
      ];
      const trees = [];
      for (let index = 0; index < anchors.length; index++) {
        const anchor = anchors[index];
        const tree = { x: anchor[0] + integer(-1, 1), z: anchor[1] + integer(-1, 1), height: anchor[2] + integer(0, 1), radius: anchor[3] + random() * .55 };
        trees.push(tree);
        for (let y = 1; y <= tree.height + 1; y++) {
          const bend = y > tree.height - 2 ? (index % 2 ? 1 : -1) : 0;
          put(tree.x + bend, y, tree.z, pick(PALETTE.bark));
          if (y <= 2) put(tree.x, y, tree.z - 1, pick(PALETTE.bark));
        }
        for (const direction of [[1, 0], [-1, 1], [0, -1]]) {
          for (let length = 1; length <= 3; length++) {
            const y = tree.height - 3 + length;
            put(tree.x + direction[0] * length, y, tree.z + direction[1] * length, pick(PALETTE.bark));
            put(tree.x + direction[0] * length, y + 1, tree.z + direction[1] * length, pick(PALETTE.bark));
          }
        }
        const reach = Math.ceil(tree.radius + 1);
        for (let x = -reach; x <= reach; x++) {
          for (let z = -reach; z <= reach; z++) {
            for (let y = -2; y <= 4; y++) {
              const crown = x * x / (tree.radius * tree.radius) + z * z / Math.pow(tree.radius * .89, 2) + Math.pow((y - .3) / 3.1, 2);
              const lobes = Math.sin(x * 1.18 + index) * .14 + Math.cos(z * 1.31 - index) * .13;
              if (crown > 1 + lobes || random() < .07) continue;
              const colors = y < 0 ? PALETTE.blossomShade : PALETTE.blossom;
              put(tree.x + x, tree.height + y + 1, tree.z + z, pick(colors));
            }
          }
        }
        for (const offset of [[1, 0], [-1, 0], [0, 1]]) put(tree.x + offset[0], 1, tree.z + offset[1], pick(PALETTE.bark));
      }

      // Stone lanterns become warm landmarks after dusk without extra lights.
      for (const location of [[-7, 13], [4, 14], [-11, 0], [15, -1], [-10, -15]]) {
        const x = location[0], z = location[1];
        put(x, 1, z, '#929e8d');
        put(x, 2, z, '#b8b9a3');
        lights.push({ x, y: 3, z, color: '#ffca80' });
        for (let dx = -1; dx <= 1; dx++) {
          for (let dz = -1; dz <= 1; dz++) put(x + dx, 4, z + dz, Math.abs(dx) + Math.abs(dz) === 2 ? '#899489' : '#a0aa99');
        }
        put(x, 5, z, '#b3b7a2');
      }
      return { blocks: Array.from(blocks.values()), water, lights, trees, pagoda, pond, torii };
    }

    const ui = {
      canvas: document.getElementById('garden'), time: document.getElementById('time'),
      timeValue: document.getElementById('time-value'), statusTime: document.getElementById('status-time'),
      cycle: document.getElementById('cycle'), speed: document.getElementById('speed'),
      speedValue: document.getElementById('speed-value'), petals: document.getElementById('petals'),
      petalsValue: document.getElementById('petals-value'), wind: document.getElementById('wind'),
      windValue: document.getElementById('wind-value'), autoRotate: document.getElementById('auto-rotate'),
      shadows: document.getElementById('shadows'), fireflies: document.getElementById('fireflies'),
      waterAnim: document.getElementById('water-anim'), wireframe: document.getElementById('wireframe'),
      regenerate: document.getElementById('regenerate'), reset: document.getElementById('reset'),
      count: document.getElementById('voxel-count'), fps: document.getElementById('fps')
    };

    function startGarden() {
      const renderer = new THREE.WebGLRenderer({ canvas: ui.canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#c4dce1');
      scene.fog = new THREE.Fog('#c4dce1', 95, 230);
      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, .1, 400);
      camera.position.set(58, 43, 64);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 7, 0);
      controls.enableDamping = true;
      controls.dampingFactor = .065;
      controls.rotateSpeed = .65;
      controls.zoomSpeed = .8;
      controls.panSpeed = .65;
      controls.minDistance = 12;
      controls.maxDistance = 145;
      controls.minPolarAngle = .12;
      controls.maxPolarAngle = Math.PI * .57;
      controls.autoRotateSpeed = .38;
      controls.update();

      const ambient = new THREE.AmbientLight('#d4e2eb', .55);
      const hemisphere = new THREE.HemisphereLight('#e7f0ef', '#7d785d', 1.15);
      scene.add(ambient, hemisphere);
      const sun = new THREE.DirectionalLight('#fff1d6', 2.6);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -41;
      sun.shadow.camera.right = 41;
      sun.shadow.camera.top = 49;
      sun.shadow.camera.bottom = -34;
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 190;
      sun.shadow.normalBias = .045;
      sun.shadow.bias = -.00025;
      sun.target.position.set(0, 6, 0);
      scene.add(sun, sun.target);
      const moon = new THREE.DirectionalLight('#9ebbf3', .4);
      moon.position.set(-40, 65, -25);
      scene.add(moon);

      // One BoxGeometry is shared by terrain, timber, water, fish and petals.
      const cube = new THREE.BoxGeometry(1, 1, 1);
      const solidMaterial = new THREE.MeshStandardMaterial({ roughness: .88, metalness: .015 });
      const waterMaterial = new THREE.MeshStandardMaterial({ roughness: .21, metalness: .12, transparent: true, opacity: .6, depthWrite: false });
      const petalMaterial = new THREE.MeshStandardMaterial({ roughness: .82, side: THREE.DoubleSide });
      const koiMaterial = new THREE.MeshStandardMaterial({ roughness: .7 });
      const lanternMaterial = new THREE.MeshStandardMaterial({ roughness: .5, emissive: '#ffb65b', emissiveIntensity: .4 });
      const voxelMaterials = [solidMaterial, waterMaterial, petalMaterial, koiMaterial, lanternMaterial];
      const fireflyMaterial = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: { uOpacity: { value: 0 }, uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) } },
        vertexShader: `
          attribute float aSize;
          uniform float uPixelRatio;
          void main() {
            vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * viewPosition;
            gl_PointSize = clamp(aSize * uPixelRatio * 100.0 / -viewPosition.z, 1.0, 24.0);
          }
        `,
        fragmentShader: `
          uniform float uOpacity;
          void main() {
            float radius = length(gl_PointCoord - vec2(0.5));
            if (radius > 0.5) discard;
            float glow = exp(-radius * 8.0) * (1.0 - smoothstep(0.3, 0.5, radius));
            vec3 color = mix(vec3(0.65, 1.0, 0.26), vec3(1.0, 1.0, 0.75), exp(-radius * 18.0));
            gl_FragColor = vec4(color, glow * uOpacity);
          }
        `
      });
      const dummy = new THREE.Object3D();
      const instanceColor = new THREE.Color();
      let seed = 0x1a2b3c;
      let data, gardenGroup, solids, waterMesh, petalMesh, koiMesh, lanternMesh, fireflyPoints;
      let petals = [], fireflyStates = [], fish = [];
      let animationRandom = mulberry32(seed ^ 0xa341316c);
      let hour = Number(ui.time.value), playing = false, flight = null;
      let worldVoxelCount = 0;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const fishShape = [
        [-1.5, 0, 0, '#f78c3b'], [-.5, 0, 0, '#fff1d0'], [.5, 0, 0, '#eb6b29'], [1.5, 0, 0, '#f7a44d'],
        [-.5, 0, -.75, '#ed7d36'], [.5, 0, -.75, '#fff1d0'], [-.5, 0, .75, '#ed7d36'], [.5, 0, .75, '#eb6b29'],
        [-2.5, 0, -.65, '#ee8f40'], [-2.5, 0, .65, '#ee8f40'], [1.6, .25, -.42, '#293c35'], [1.6, .25, .42, '#293c35']
      ];

      function makeInstances(records, material, dynamic = false) {
        const mesh = new THREE.InstancedMesh(cube, material, records.length);
        if (dynamic) mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        for (let index = 0; index < records.length; index++) {
          const block = records[index];
          dummy.position.set(block.x, block.y, block.z);
          dummy.updateMatrix();
          mesh.setMatrixAt(index, dummy.matrix);
          mesh.setColorAt(index, instanceColor.set(block.color));
        }
        mesh.instanceMatrix.needsUpdate = true;
        if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
        mesh.computeBoundingSphere();
        gardenGroup.add(mesh);
        return mesh;
      }

      function respawnPetal(petal, initial) {
        const tree = data.trees[Math.floor(animationRandom() * data.trees.length)];
        petal.x = tree.x + (animationRandom() - .5) * tree.radius * 2.5;
        petal.z = tree.z + (animationRandom() - .5) * tree.radius * 2.4;
        petal.y = initial ? -10 + animationRandom() * 45 : 25 + animationRandom() * 15;
        petal.rx = animationRandom() * Math.PI * 2;
        petal.ry = animationRandom() * Math.PI * 2;
        petal.rz = animationRandom() * Math.PI * 2;
      }

      function buildGarden() {
        if (gardenGroup) {
          gardenGroup.traverse(object => {
            if (object.isInstancedMesh) object.dispose();
            if (object.isPoints) object.geometry.dispose();
          });
          scene.remove(gardenGroup);
        }
        data = createGardenData(seed);
        animationRandom = mulberry32(seed ^ 0xa341316c);
        gardenGroup = new THREE.Group();
        scene.add(gardenGroup);
        solids = makeInstances(data.blocks, solidMaterial);
        solids.castShadow = true;
        solids.receiveShadow = true;
        waterMesh = makeInstances(data.water, waterMaterial, true);
        waterMesh.receiveShadow = true;
        waterMesh.renderOrder = 2;
        lanternMesh = makeInstances(data.lights, lanternMaterial);
        lanternMesh.castShadow = true;

        petalMesh = new THREE.InstancedMesh(cube, petalMaterial, 3000);
        petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        petalMesh.frustumCulled = false;
        petals = [];
        for (let index = 0; index < 3000; index++) {
          const petal = {
            x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0,
            size: .17 + animationRandom() * .19, fall: .85 + animationRandom() * 1.15,
            spinX: (animationRandom() - .5) * 2.2, spinY: (animationRandom() - .5) * 1.8,
            spinZ: (animationRandom() - .5) * 1.9, phase: animationRandom() * Math.PI * 2
          };
          respawnPetal(petal, true);
          petals.push(petal);
          petalMesh.setColorAt(index, instanceColor.set(PALETTE.blossom[Math.floor(animationRandom() * 3)]));
        }
        petalMesh.count = Number(ui.petals.value);
        petalMesh.instanceColor.needsUpdate = true;
        gardenGroup.add(petalMesh);

        fish = [];
        koiMesh = new THREE.InstancedMesh(cube, koiMaterial, fishShape.length * 3);
        koiMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        koiMesh.frustumCulled = false;
        for (let index = 0; index < 3; index++) {
          fish.push({ phase: animationRandom() * Math.PI * 2, speed: .12 + animationRandom() * .06, rx: 2.2 + index * .8, rz: 1.2 + index * .45 });
          for (let part = 0; part < fishShape.length; part++) {
            const color = index === 1 && part % 4 === 0 ? '#fff1d0' : fishShape[part][3];
            koiMesh.setColorAt(index * fishShape.length + part, instanceColor.set(color));
          }
        }
        koiMesh.instanceColor.needsUpdate = true;
        gardenGroup.add(koiMesh);

        const positions = new Float32Array(80 * 3);
        const sizes = new Float32Array(80);
        fireflyStates = [];
        for (let index = 0; index < 80; index++) {
          const angle = animationRandom() * Math.PI * 2;
          const radius = 3 + animationRandom() * 16;
          const state = { x: Math.cos(angle) * radius, y: 1.5 + animationRandom() * 8, z: Math.sin(angle) * radius, phase: animationRandom() * Math.PI * 2, rate: .2 + animationRandom() * .35 };
          fireflyStates.push(state);
          positions[index * 3] = state.x;
          positions[index * 3 + 1] = state.y;
          positions[index * 3 + 2] = state.z;
          sizes[index] = 2.5 + animationRandom() * 3.5;
        }
        const fireflyGeometry = new THREE.BufferGeometry();
        fireflyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
        fireflyGeometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
        fireflyPoints = new THREE.Points(fireflyGeometry, fireflyMaterial);
        fireflyPoints.frustumCulled = false;
        gardenGroup.add(fireflyPoints);
        worldVoxelCount = data.blocks.length + data.water.length + data.lights.length + fishShape.length * 3;
        updateVoxelCount();
        document.getElementById('seed-label').textContent = 'SEED ' + seed.toString(16).toUpperCase().padStart(6, '0');
        ui.canvas.dataset.seed = String(seed);
        ui.canvas.dataset.trees = String(data.trees.length);
        ui.canvas.dataset.tiers = String(data.pagoda.tiers);
        updateAnimatedObjects(0, 0);
      }

      function updateVoxelCount() {
        const count = worldVoxelCount + (petalMesh ? petalMesh.count : 0);
        ui.count.textContent = count.toLocaleString('en-US');
        ui.canvas.dataset.voxels = String(count);
      }

      const skyKeys = [
        [0, new THREE.Color('#132139')], [4, new THREE.Color('#24304a')],
        [5.5, new THREE.Color('#b493a2')], [7, new THREE.Color('#bdd8df')],
        [12, new THREE.Color('#d0e5e8')], [16, new THREE.Color('#c7dce0')],
        [18, new THREE.Color('#dfb19f')], [19.5, new THREE.Color('#6d728e')],
        [21, new THREE.Color('#20304a')], [24, new THREE.Color('#132139')]
      ];
      const dawnSun = new THREE.Color('#ffb16d');
      const noonSun = new THREE.Color('#fff6df');
      const nightInk = new THREE.Color('#deebd9');
      const dayInk = new THREE.Color('#344c50');
      const ink = new THREE.Color();
      const smoothstep = (a, b, value) => {
        const t = Math.max(0, Math.min(1, (value - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };
      function formatTime(value) {
        const minutes = Math.floor(Math.min(24, Math.max(0, value)) * 60 + .0001);
        return String(Math.floor(minutes / 60)).padStart(2, '0') + ':' + String(minutes % 60).padStart(2, '0');
      }
      function paintRange(input) {
        input.style.setProperty('--fill', (Number(input.value) - Number(input.min)) / (Number(input.max) - Number(input.min)) * 100 + '%');
      }
      let lastPaintedTime = '';
      function updateDayNight() {
        const normalizedHour = hour === 24 ? 24 : ((hour % 24) + 24) % 24;
        const angle = (normalizedHour - 6) / 24 * Math.PI * 2;
        const altitude = Math.sin(angle);
        const daylight = smoothstep(-.2, .3, altitude);
        const night = 1 - smoothstep(-.22, .12, altitude);
        sun.position.set(Math.cos(angle) * 75, altitude * 85 + 9, 38);
        sun.intensity = Math.max(0, altitude) * 2.65;
        sun.color.copy(dawnSun).lerp(noonSun, smoothstep(.03, .65, altitude));
        moon.position.set(-Math.cos(angle) * 55, Math.max(14, -altitude * 70), -38);
        moon.intensity = .7 * night;
        ambient.intensity = .23 + daylight * .4;
        hemisphere.intensity = .35 + daylight * .85;
        hemisphere.color.set(daylight > .5 ? '#e1eeed' : '#849ac5');
        hemisphere.groundColor.set(daylight > .5 ? '#7e7c61' : '#3d485b');
        for (let index = 1; index < skyKeys.length; index++) {
          if (normalizedHour <= skyKeys[index][0]) {
            const before = skyKeys[index - 1], after = skyKeys[index];
            const blend = smoothstep(0, 1, (normalizedHour - before[0]) / (after[0] - before[0]));
            scene.background.copy(before[1]).lerp(after[1], blend);
            scene.fog.color.copy(scene.background);
            break;
          }
        }
        renderer.toneMappingExposure = .94 + daylight * .14;
        lanternMaterial.emissiveIntensity = .2 + night * 2.1;
        fireflyMaterial.uniforms.uOpacity.value = ui.fireflies.checked ? night : 0;
        fireflyPoints.visible = ui.fireflies.checked && night > .002;
        ink.copy(nightInk).lerp(dayInk, daylight);
        document.documentElement.style.setProperty('--scene-ink', '#' + ink.getHexString());
        const text = formatTime(hour);
        if (lastPaintedTime !== text) {
          ui.timeValue.textContent = text;
          ui.statusTime.textContent = text;
          lastPaintedTime = text;
        }
      }

      function updateAnimatedObjects(delta, elapsed) {
        const wind = Number(ui.wind.value);
        dummy.scale.set(1, 1, 1);
        dummy.rotation.set(0, 0, 0);
        for (let index = 0; index < data.water.length; index++) {
          const block = data.water[index];
          const wave = ui.waterAnim.checked ? Math.sin(elapsed * 1.65 + block.x * .48 + block.z * .36) * .035 : 0;
          dummy.position.set(block.x, block.y + wave, block.z);
          dummy.updateMatrix();
          waterMesh.setMatrixAt(index, dummy.matrix);
        }
        waterMesh.instanceMatrix.needsUpdate = true;

        for (let index = 0; index < petalMesh.count; index++) {
          const petal = petals[index];
          petal.x += (wind * 3.1 + Math.sin(elapsed * .7 + petal.phase) * .32) * delta;
          petal.z += (wind * .65 + Math.cos(elapsed * .48 + petal.phase) * .26) * delta;
          petal.y -= petal.fall * delta;
          petal.rx += petal.spinX * delta;
          petal.ry += petal.spinY * delta;
          petal.rz += petal.spinZ * delta;
          if (petal.y < -18 || Math.abs(petal.x) > 37 || Math.abs(petal.z) > 37) respawnPetal(petal, false);
          dummy.position.set(petal.x, petal.y, petal.z);
          dummy.rotation.set(petal.rx, petal.ry, petal.rz);
          dummy.scale.set(petal.size, petal.size * .13, petal.size * .65);
          dummy.updateMatrix();
          petalMesh.setMatrixAt(index, dummy.matrix);
        }
        petalMesh.instanceMatrix.needsUpdate = true;

        for (let index = 0; index < fish.length; index++) {
          const koi = fish[index];
          const phase = elapsed * koi.speed + koi.phase;
          const centerX = data.pond.x + Math.cos(phase) * koi.rx;
          const centerZ = data.pond.z + Math.sin(phase) * koi.rz;
          const facing = Math.atan2(-Math.cos(phase) * koi.rz, -Math.sin(phase) * koi.rx);
          const cosine = Math.cos(facing), sine = Math.sin(facing);
          for (let part = 0; part < fishShape.length; part++) {
            const block = fishShape[part];
            const tailSway = part >= 8 && part < 10 ? Math.sin(elapsed * 3.6 + koi.phase) * .11 : 0;
            const localX = block[0] * .32;
            const localZ = block[2] * .29 + tailSway;
            dummy.position.set(centerX + localX * cosine + localZ * sine, -.17 + block[1] * .2 + Math.sin(phase * 2) * .025, centerZ - localX * sine + localZ * cosine);
            dummy.rotation.set(0, facing, 0);
            dummy.scale.set(.34, .2, .29);
            dummy.updateMatrix();
            koiMesh.setMatrixAt(index * fishShape.length + part, dummy.matrix);
          }
        }
        koiMesh.instanceMatrix.needsUpdate = true;

        if (fireflyPoints.visible) {
          const positions = fireflyPoints.geometry.attributes.position;
          for (let index = 0; index < fireflyStates.length; index++) {
            const fly = fireflyStates[index];
            const phase = elapsed * fly.rate + fly.phase;
            positions.setXYZ(index, fly.x + Math.sin(phase) * 1.5, fly.y + Math.sin(phase * 1.7) * .65, fly.z + Math.cos(phase * .8) * 1.25);
          }
          positions.needsUpdate = true;
        }
      }

      function preset(number) {
        const p = data.pagoda, pond = data.pond, gate = data.torii, tree = data.trees[0];
        const overview = window.innerWidth < 700 ? [76, 55, 85] : [58, 43, 64];
        const views = {
          1: { position: overview, target: [0, 7, 0] },
          2: { position: [p.x + 29, 29, p.z + 38], target: [p.x, 18, p.z] },
          3: { position: [pond.x + 17, 16, pond.z + 21], target: [pond.x, 1, pond.z] },
          4: { position: [gate.x + 19, 13, gate.z + 24], target: [gate.x, 5, gate.z] },
          5: { position: [tree.x + 19, tree.height + 11, tree.z + 22], target: [tree.x, tree.height + 1.7, tree.z] }
        };
        return views[number] || views[1];
      }
      function markPreset(number) {
        document.querySelectorAll('.preset').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.preset) === number)));
      }
      function flyTo(number, immediate = false) {
        const view = preset(number);
        markPreset(number);
        if (immediate) {
          camera.position.fromArray(view.position);
          controls.target.fromArray(view.target);
          controls.update();
          flight = null;
          controls.enabled = true;
          return;
        }
        flight = {
          started: performance.now(), duration: reducedMotion ? 120 : 1200,
          fromPosition: camera.position.clone(), fromTarget: controls.target.clone(),
          toPosition: new THREE.Vector3().fromArray(view.position), toTarget: new THREE.Vector3().fromArray(view.target)
        };
        controls.enabled = false;
      }
      controls.addEventListener('start', () => markPreset(0));
      ui.canvas.addEventListener('pointerdown', () => {
        if (flight) { flight = null; controls.enabled = true; markPreset(0); }
      });
      document.querySelectorAll('.preset').forEach(button => button.addEventListener('click', () => flyTo(Number(button.dataset.preset))));
      window.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
        if (/^[1-5]$/.test(event.key)) { event.preventDefault(); flyTo(Number(event.key)); }
      });
      ui.reset.addEventListener('click', () => flyTo(1));
      ui.cycle.addEventListener('click', () => {
        playing = !playing;
        ui.cycle.textContent = playing ? 'Ⅱ Pause cycle' : '▶ Play cycle';
        ui.cycle.setAttribute('aria-pressed', String(playing));
      });
      ui.time.addEventListener('input', () => { hour = Number(ui.time.value); paintRange(ui.time); updateDayNight(); });
      ui.speed.addEventListener('input', () => { ui.speedValue.textContent = Number(ui.speed.value).toFixed(1) + '×'; paintRange(ui.speed); });
      ui.petals.addEventListener('input', () => {
        petalMesh.count = Math.max(0, Math.min(3000, Number(ui.petals.value)));
        ui.petalsValue.textContent = petalMesh.count.toLocaleString('en-US');
        paintRange(ui.petals);
        updateVoxelCount();
      });
      ui.wind.addEventListener('input', () => { ui.windValue.textContent = Number(ui.wind.value).toFixed(2); paintRange(ui.wind); });
      ui.shadows.addEventListener('change', () => {
        renderer.shadowMap.enabled = ui.shadows.checked;
        sun.castShadow = ui.shadows.checked;
        sun.shadow.needsUpdate = true;
        for (const material of voxelMaterials) material.needsUpdate = true;
      });
      ui.fireflies.addEventListener('change', updateDayNight);
      ui.wireframe.addEventListener('change', () => {
        for (const material of voxelMaterials) { material.wireframe = ui.wireframe.checked; material.needsUpdate = true; }
      });
      ui.regenerate.addEventListener('click', () => {
        ui.regenerate.disabled = true;
        requestAnimationFrame(() => {
          try {
            const nextSeed = mulberry32(seed ^ 0x9e3779b9);
            seed = Math.floor(nextSeed() * 4294967296) >>> 0;
            buildGarden();
            updateDayNight();
            flyTo(1);
          } catch (error) {
            console.error(error);
            gardenLoadError('The garden could not regenerate. Try resetting your browser’s WebGL context by reopening this file.');
          } finally { ui.regenerate.disabled = false; }
        });
      });
      document.getElementById('fold').addEventListener('click', event => {
        const panel = document.querySelector('.controls');
        const collapsed = panel.classList.toggle('collapsed');
        event.currentTarget.setAttribute('aria-expanded', String(!collapsed));
        event.currentTarget.setAttribute('aria-label', collapsed ? 'Expand controls' : 'Collapse controls');
      });
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        renderer.setPixelRatio(ratio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        fireflyMaterial.uniforms.uPixelRatio.value = ratio;
      });
      ui.canvas.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        gardenLoadError('The graphics context was interrupted. Reopen the file to restore the garden.');
      });

      buildGarden();
      flyTo(1, true);
      updateDayNight();
      document.querySelectorAll('input[type="range"]').forEach(paintRange);
      let previous = performance.now(), elapsed = 0, fpsStarted = previous, frames = 0;
      function animate(now) {
        requestAnimationFrame(animate);
        const delta = Math.max(0, Math.min((now - previous) / 1000, .05));
        previous = now;
        elapsed += delta;
        if (playing) {
          hour = (hour + delta * .16 * Number(ui.speed.value)) % 24;
          ui.time.value = String(hour);
          paintRange(ui.time);
        }
        updateDayNight();
        updateAnimatedObjects(delta, elapsed);
        if (flight) {
          const progress = Math.min(1, (now - flight.started) / flight.duration);
          const ease = progress < .5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
          camera.position.lerpVectors(flight.fromPosition, flight.toPosition, ease);
          controls.target.lerpVectors(flight.fromTarget, flight.toTarget, ease);
          if (progress >= 1) { flight = null; controls.enabled = true; }
        }
        controls.autoRotate = ui.autoRotate.checked && !flight;
        controls.update();
        renderer.render(scene, camera);
        frames++;
        if (now - fpsStarted >= 1000) {
          ui.fps.textContent = String(Math.round(frames * 1000 / (now - fpsStarted)));
          ui.canvas.dataset.drawCalls = String(renderer.info.render.calls);
          fpsStarted = now;
          frames = 0;
        }
      }
      requestAnimationFrame(animate);
      requestAnimationFrame(() => document.getElementById('loading').classList.add('ready'));
    }

    try { startGarden(); }
    catch (error) {
      console.error(error);
      gardenLoadError('The garden could not start. A modern browser with WebGL and internet access to jsDelivr is required.');
    }
  </script>
</body>
</html>
